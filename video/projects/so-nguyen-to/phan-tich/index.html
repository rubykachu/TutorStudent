<!DOCTYPE html>
<!--
  Lesson video "Phân tích ra thừa số nguyên tố" (lesson so-nguyen-to): 12 split
  in a tree (12 = 3 · 4, 4 = 2 · 2) and 60 divided in a column (2, 2, 3, 5);
  primes are sky with ✚, composites pink with ◆, the result sits on the
  highlight yellow. Built by `pnpm video:build so-nguyen-to phan-tich`, which
  injects window.TIMING.
-->
<html lang="vi">
  <head>
    <title>Phân tích ra thừa số nguyên tố</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="base.css" />
    <style>
      .nd { position: absolute; width: 88px; height: 88px; margin: -44px 0 0 -44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--color-surface); border: 6px solid var(--c); color: var(--c); font: 800 54px / 1 "Baloo 2", sans-serif; }
      .nd i { position: absolute; top: -14px; right: -12px; font: 700 28px / 1 "Be Vietnam Pro", sans-serif; font-style: normal; background: var(--color-background); border-radius: 50%; padding: 2px; }
      .sky { --c: var(--color-concept-sky); } .pink { --c: var(--color-concept-pink); }
      .ps { color: var(--color-concept-sky); } .pk { color: var(--color-concept-pink); }
      .shift { padding-left: 240px; }
      .cv { position: absolute; font: 800 62px / 1 "Baloo 2", sans-serif; width: 160px; height: 70px; display: flex; align-items: center; }
      .cv.l { justify-content: flex-end; }
      .cv.l.g { color: var(--color-foreground); }
      .cv.r { justify-content: flex-start; color: var(--color-concept-sky); }
      .chip { font-size: 34px; }
      .bar { position: absolute; background: var(--color-foreground); border-radius: 3px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="90" data-width="1280" data-height="720">
      <div id="stage" class="layer">
        <section id="s1" class="scene layer">
          <div id="a1" class="row" style="top: 120px"></div>
          <div id="a2" class="row" style="top: 270px"></div>
        </section>
        <section id="s2" class="scene layer">
          <svg id="lines" class="layer" viewBox="0 0 1280 720">
            <title>Sơ đồ cây của 12</title>
            <g stroke="var(--color-muted-foreground)" stroke-width="6" stroke-linecap="round">
              <line id="e1" x1="640" y1="95" x2="500" y2="210" />
              <line id="e2" x1="640" y1="95" x2="780" y2="210" />
              <line id="e3" x1="780" y1="210" x2="700" y2="325" />
              <line id="e4" x1="780" y1="210" x2="860" y2="325" />
            </g>
          </svg>
          <div id="n12" class="nd pink" style="left: 640px; top: 95px">12<i>◆</i></div>
          <div id="n3" class="nd sky" style="left: 500px; top: 210px">3<i>✚</i></div>
          <div id="n4" class="nd pink" style="left: 780px; top: 210px">4<i>◆</i></div>
          <div id="n2a" class="nd sky" style="left: 700px; top: 325px">2<i>✚</i></div>
          <div id="n2b" class="nd sky" style="left: 860px; top: 325px">2<i>✚</i></div>
          <div id="f1" class="row shift" style="top: 410px"></div>
        </section>
        <section id="s3" class="scene layer">
          <div id="col" class="layer"></div>
          <div id="k1" class="abs" style="left: 580px; top: 60px"></div>
          <div id="k2" class="abs" style="left: 580px; top: 150px"></div>
          <div id="f2" class="row shift" style="top: 410px"></div>
        </section>
      </div>
      <div id="owl-layer" class="layer"></div>
      <div id="fade" class="layer" style="background: var(--color-background)"></div>
    </div>

    <script src="gsap.min.js"></script>
    <script src="owl.js"></script>
    <script src="figures.js"></script>
    <script>/*TIMING:BEGIN*/window.TIMING=null;/*TIMING:END*/</script>
    <script src="runtime.js"></script>
    <script>
      (() => {
        const { tl, $, start, W, owl, pop, hide, pose, scenes, finish } = window.LV;
        const chip = (id, c, html) => `<span id="${id}" class="chip" style="--c: var(--color-concept-${c})">${html}</span>`;

        // ---------- DOM ----------
        $("#a1").innerHTML = `<span id="t12" class="nd pink" style="position: static; margin: 0; width: 120px; height: 120px; font-size: 76px">12<i>◆</i></span>`;
        $("#a2").innerHTML = `<span id="tf" class="math pill"><span>12</span> <span>=</span> <span class="ps">2</span> <span class="op">·</span> <span class="ps">2</span> <span class="op">·</span> <span class="ps">3</span></span>`;
        $("#f1").innerHTML = `<span id="f1p" class="math pill"><span>12</span> <span>=</span> <span class="ps">2</span> <span class="op">·</span> <span class="ps">2</span> <span class="op">·</span> <span class="ps">3</span></span>`;
        $("#f2").innerHTML = `<span id="f2p" class="math pill"><span>60</span> <span>=</span> <span class="ps">2</span> <span class="op">·</span> <span class="ps">2</span> <span class="op">·</span> <span class="ps">3</span> <span class="op">·</span> <span class="ps">5</span></span>`;
        // The column of 60: numbers left of the bar, divisors right of it.
        {
          const col = $("#col");
          const left = [60, 30, 15, 5, 1];
          const right = [2, 2, 3, 5];
          const top = 26;
          const bar = document.createElement("div");
          bar.className = "bar";
          bar.id = "bar";
          bar.style.cssText = `left:420px;top:${top}px;width:6px;height:${left.length * 72}px`;
          col.append(bar);
          left.forEach((n, i) => {
            const d = document.createElement("div");
            d.id = `cl${i}`;
            d.className = "cv l g";
            d.style.cssText = `left:${420 - 28 - 160}px;top:${top + i * 72}px`;
            d.textContent = n;
            col.append(d);
          });
          right.forEach((n, i) => {
            const d = document.createElement("div");
            d.id = `cr${i}`;
            d.className = "cv r";
            d.style.cssText = `left:${420 + 34}px;top:${top + i * 72}px`;
            d.textContent = n;
            col.append(d);
          });
        }
        $("#k1").innerHTML = chip("k1c", "sky", "✚ chia cho số nguyên tố nhỏ nhất");
        $("#k2").innerHTML = chip("k2c", "slate", "chia tiếp thương tới khi được 1");
        const bird = owl($("#owl-layer"), ["idle", "happy", "cheer"], { left: "34px", top: "366px" });

        scenes([["#s1", "s01-thua-so"], ["#s2", "s02-cay"], ["#s3", "s03-cot"]]);
        pop(bird.wrap, 0.3, { from: 0.3 });

        // ---------- s01: 12 is a product of primes ----------
        {
          const sid = "s01-thua-so";
          hide(["#t12", "#tf"]);
          pose(bird, "happy", W(sid, "chào"));
          pop("#t12", W(sid, "số"), { from: 0.4 });
          pose(bird, "idle", W(sid, "muốn"));
          pop("#tf", W(sid, "tích", 2), { from: 0.6 });
        }

        // ---------- s02: the tree of 12 ----------
        {
          const sid = "s02-cay";
          hide(["#n12", "#n3", "#n4", "#n2a", "#n2b", "#e1", "#e2", "#e3", "#e4", "#f1p"]);
          pose(bird, "idle", start(sid));
          pop("#n12", W(sid, "12"), { from: 0.4 });
          tl.to("#n12", { scale: 1.15, yoyo: true, repeat: 1, duration: 0.25 }, W(sid, "tách"));
          pop(["#e1", "#n3"], W(sid, "3", 2), { from: 0.4 });
          pop(["#e2", "#n4"], W(sid, "4", 2), { from: 0.4 });
          tl.to("#n3", { scale: 1.2, yoyo: true, repeat: 1, duration: 0.25 }, W(sid, "3", 3));
          pose(bird, "happy", W(sid, "3", 3));
          pop(["#e3", "#n2a"], W(sid, "2"), { from: 0.4 });
          pop(["#e4", "#n2b"], W(sid, "2", 2), { from: 0.4 });
          pop("#f1p", W(sid, "12", 3), { from: 0.6 });
        }

        // ---------- s03: the column of 60 ----------
        {
          const sid = "s03-cot";
          hide(["#k1c", "#k2c", "#bar", "#cl0", "#cl1", "#cl2", "#cl3", "#cl4", "#cr0", "#cr1", "#cr2", "#cr3", "#f2p"]);
          pose(bird, "idle", start(sid));
          pop("#cl0", W(sid, "60"), { from: 0.4 });
          pop("#bar", W(sid, "cột"), { from: 0.6 });
          pop("#k1c", W(sid, "chia"), { from: 0.6 });
          pop("#k2c", W(sid, "thương"), { from: 0.6 });
          pop("#cr0", W(sid, "2"), { from: 0.4 });
          pop("#cl1", W(sid, "30"), { from: 0.4 });
          pop("#cr1", W(sid, "2", 2), { from: 0.4 });
          pop("#cl2", W(sid, "15"), { from: 0.4 });
          pop("#cr2", W(sid, "3"), { from: 0.4 });
          pop("#cl3", W(sid, "5"), { from: 0.4 });
          pop("#cr3", W(sid, "5", 3), { from: 0.4 });
          pop("#cl4", W(sid, "1", 2), { from: 0.4 });
          pose(bird, "happy", W(sid, "1", 2));
          pop("#f2p", W(sid, "60", 3), { from: 0.6 });
        }

        finish();
      })();
    </script>
  </body>
</html>
