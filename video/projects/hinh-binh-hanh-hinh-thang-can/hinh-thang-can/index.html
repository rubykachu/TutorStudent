<!doctype html>
<!--
  Lesson video "Hình thang cân" (lesson hinh-binh-hanh-hinh-thang-can): the isosceles trapezoid: two parallel bases, equal legs, equal base angles and equal diagonals; its example is the A-frame ladder.
  Colours as in the lesson: trapezoid sky, side blue, angle violet, diagonal amber. The shapes are the lesson's own figures
  (figures.tsx). Built by `pnpm video:build hinh-binh-hanh-hinh-thang-can hinh-thang-can`, which injects window.TIMING.
  The rule cards carry `data-rule-text`: their text is the lesson's note word for word.
-->
<html lang="vi">
  <head>
    <title>Hình thang cân</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="base.css" />
    <style>
      .step {
        position: absolute;
        left: 880px;
        top: 220px;
        width: 340px;
        display: flex;
      }
      .step .chip {
        white-space: normal;
        font-size: 34px;
      }
      .rule {
        position: absolute;
        left: 100px;
        width: 1080px;
        top: 30px;
        padding: 20px 32px;
        font:
          600 30px / 1.4 "Be Vietnam Pro",
          sans-serif;
        text-align: center;
        box-sizing: border-box;
        text-wrap: balance;
      }
      .figure-wrap {
        width: 560px;
        height: 400px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="75"
      data-width="1280"
      data-height="720"
    >
      <div id="stage" class="layer">
        <section id="s1" class="scene layer">
          <div class="row title" style="top: 50px">Hình thang cân</div>

          <div id="t1" class="step" style="top: 220px">
            <span class="chip" style="--c: var(--color-concept-sky)"
              >Thang chữ A: hình thang cân</span
            >
          </div>
        </section>
        <section id="s2" class="scene layer">
          <div id="t2" class="step" style="top: 220px">
            <span class="chip" style="--c: var(--color-concept-sky)"
              >Hình thang cân</span
            >
          </div>
        </section>
        <section id="s3" class="scene layer">
          <div id="t3" class="step" style="top: 220px">
            <span class="chip" style="--c: var(--color-concept-slate)"
              >Hai cạnh đáy song song</span
            >
          </div>
        </section>
        <section id="s4" class="scene layer">
          <div id="rule4" class="card rule" data-rule-text>
            Hình thang cân có hai cạnh bên bằng nhau.
          </div>
        </section>
        <section id="s5" class="scene layer">
          <div id="rule5" class="card rule" data-rule-text>
            Hai góc kề một đáy bằng nhau.
          </div>
        </section>
        <section id="s6" class="scene layer">
          <div id="t6" class="step" style="top: 220px">
            <span class="chip" style="--c: var(--color-concept-amber)"
              >Đường chéo</span
            >
          </div>
        </section>
        <section id="s7" class="scene layer">
          <div id="t7" class="step" style="top: 220px">
            <span class="chip" style="--c: var(--color-concept-amber)"
              >Hai đường chéo</span
            >
          </div>
        </section>
        <section id="s8" class="scene layer">
          <div id="rule8" class="card rule" data-rule-text>
            Hai đường chéo của hình thang cân bằng nhau.
          </div>
        </section>
        <section id="s9" class="scene layer">
          <div id="t9" class="step" style="top: 220px">
            <span class="chip" style="--c: var(--color-concept-sky)"
              >Cạnh bên, đường chéo: bằng nhau</span
            >
          </div>
        </section>
      </div>
      <div id="owl-layer" class="layer"></div>
      <div
        id="fade"
        class="layer"
        style="background: var(--color-background)"
      ></div>
    </div>

    <script src="gsap.min.js"></script>
    <script src="owl.js"></script>
    <script src="figures.js"></script>
    <script>
      /*TIMING:BEGIN*/ window.TIMING = null; /*TIMING:END*/
    </script>
    <script src="runtime.js"></script>
    <script>
      (() => {
        const {
          $,
          start,
          W,
          owl,
          figure,
          pop,
          hide,
          pose,
          scenes,
          finish,
          tl,
        } = window.LV;
        const bird = owl($("#owl-layer"), ["idle", "happy", "cheer"], {
          left: "30px",
          top: "385px",
          width: "150px",
          height: "150px",
        });
        pop(bird.wrap, 0.3, { from: 0.3 });

        scenes(
          [
            ["#s1", "s01-chao"],
            ["#s2", "s02-hoi"],
            ["#s3", "s03-day"],
            ["#s4", "s04-ben"],
            ["#s5", "s05-goc"],
            ["#s6", "s06-cheo"],
            ["#s7", "s07-hoi"],
            ["#s8", "s08-bang"],
            ["#s9", "s09-nho"],
          ],
          { leave: 0 },
        );

        // A picture of the lesson in the middle of the stage, with the variants
        // to switch between (only the first shows); the picture of a scene is
        // there from its first frame.
        const picture = (section, names, top = 148) =>
          figure($(section), names, { left: "300px", top: `${top}px` });
        // Shows one variant of a picture from time t.
        const show = (f, name, t) => {
          for (const [key, layer] of Object.entries(f.layers)) {
            tl.set(layer, { opacity: key === name ? 1 : 0 }, t);
          }
        };

        {
          const sid = "s01-chao";
          picture("#s1", ["ladder"], 148);
          hide(["#t1"]);
          pose(bird, "happy", W(sid, "chào"));
          pose(bird, "idle", W(sid, "bạn"));
          pop("#t1", W(sid, "chiếc"), { from: 0.6 });
        }
        {
          const sid = "s02-hoi";
          picture("#s2", ["tc-plain"]);
          hide(["#t2"]);
          pose(bird, "idle", start(sid));
          pop("#t2", start(sid) + 0.1, { from: 0.6 });
        }
        {
          const sid = "s03-day";
          const f = picture("#s3", ["tc-plain", "tc-day", "tc-ben"]);
          hide(["#t3"]);
          pose(bird, "idle", start(sid));
          pop("#t3", W(sid, "hai"), { from: 0.6 });
          show(f, "tc-day", W(sid, "hai"));
          show(f, "tc-ben", W(sid, "còn"));
        }
        {
          const sid = "s04-ben";
          picture("#s4", ["tc-ben"]);
          hide(["#rule4"]);
          pose(bird, "idle", start(sid));
          pop("#rule4", start(sid) + 0.1, { from: 0.9 });
        }
        {
          const sid = "s05-goc";
          const f = picture("#s5", ["tc-ben", "tc-goc"]);
          hide(["#rule5"]);
          pose(bird, "idle", start(sid));
          pop("#rule5", W(sid, "hai", 3), { from: 0.9 });
          show(f, "tc-goc", W(sid, "hai"));
        }
        {
          const sid = "s06-cheo";
          const f = picture("#s6", ["tc-plain", "tc-ac", "tc-cheo"]);
          hide(["#t6"]);
          pose(bird, "idle", start(sid));
          pop("#t6", W(sid, "đường"), { from: 0.6 });
          show(f, "tc-ac", W(sid, "đường"));
          show(f, "tc-cheo", W(sid, "hai"));
        }
        {
          const sid = "s07-hoi";
          picture("#s7", ["tc-cheo"]);
          hide(["#t7"]);
          pose(bird, "idle", start(sid));
          pop("#t7", start(sid) + 0.1, { from: 0.6 });
        }
        {
          const sid = "s08-bang";
          const f = picture("#s8", ["tc-cheo", "tc-bang"]);
          hide(["#rule8"]);
          pose(bird, "idle", start(sid));
          pose(bird, "cheer", W(sid, "bằng"));
          pop("#rule8", start(sid) + 0.1, { from: 0.9 });
          show(f, "tc-bang", W(sid, "bằng"));
        }
        {
          const sid = "s09-nho";
          picture("#s9", ["tc-final"]);
          hide(["#t9"]);
          pose(bird, "idle", start(sid));
          pop("#t9", W(sid, "nhớ"), { from: 0.6 });
        }

        finish();
      })();
    </script>
  </body>
</html>
