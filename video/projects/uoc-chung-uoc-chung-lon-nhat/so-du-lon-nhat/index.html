<!DOCTYPE html>
<!--
  Lesson video "Số lớn nhất cho cùng số dư" (lesson uoc-chung-uoc-chung-lon-nhat):
  29, 53 and 89 sweets in equal bags leave the same remainder; the differences
  of neighbours 24 and 36 have greatest common divisor 12 (amber), the most
  sweets per bag, and 12 leaves remainder 5 (lime) each time. Numbers are
  slate, as in the lesson. The title and the three numbers are on screen from
  the first frame.
  Built by `pnpm video:build uoc-chung-uoc-chung-lon-nhat so-du-lon-nhat`,
  which injects window.TIMING.
-->
<html lang="vi">
  <head>
    <title>Số lớn nhất cho cùng số dư</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="base.css" />
    <style>
      .amber { --c: var(--color-concept-amber); }
      .lime { --c: var(--color-concept-lime); }
      .slate { --c: var(--color-concept-slate); }
      .chip { font-size: 40px; }
      .big { font-size: 56px; padding: 6px 28px; }
      .am { color: var(--color-concept-amber); }
      .lm { color: var(--color-concept-lime); }
      .q { color: var(--color-muted-foreground); }
      .slot { display: inline-grid; }
      .slot > * { grid-area: 1 / 1; }
      .eq { position: absolute; font: 800 64px / 1.1 "Baloo 2", sans-serif; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="90" data-width="1280" data-height="720">
      <div id="stage" class="layer">
        <section id="s1" class="scene layer"><div id="z1" class="layer"></div></section>
        <section id="s2" class="scene layer"><div id="z2" class="layer"></div></section>
        <section id="s3" class="scene layer"><div id="z3" class="layer"></div></section>
      </div>
      <div id="owl-layer" class="layer"></div>
      <div id="fade" class="layer" style="background: var(--color-background)"></div>
    </div>

    <script src="gsap.min.js"></script>
    <script src="owl.js"></script>
    <script src="figures.js"></script>
    <script>/*TIMING:BEGIN*/window.TIMING=null;/*TIMING:END*/</script>
    <script src="runtime.js"></script>
    <script>
      (() => {
        const { tl, $, start, W, owl, pop, hide, fade, pose, scenes, finish } = window.LV;
        const chip = (id, cls, html) => `<span id="${id}" class="chip ${cls}">${html}</span>`;
        const el = (host, html) => {
          host.insertAdjacentHTML("beforeend", html);
        };
        const title = (host, id, cls, html) =>
          el(host, `<div class="abs" style="left:250px;top:28px">${chip(id, cls, html)}</div>`);
        const at = (id, left, top, cls, html) =>
          `<div id="${id}" class="abs" style="left:${left}px;top:${top}px">${chip(`${id}c`, cls, html)}</div>`;
        const packs = `
          ${at("n1", 330, 130, "slate big", "29 cái")}
          ${at("n2", 580, 130, "slate big", "53 cái")}
          ${at("n3", 830, 130, "slate big", "89 cái")}`;

        // ---------- s01: three packs of sweets ----------
        title($("#z1"), "t1", "amber", "Số lớn nhất, cùng số dư");
        el($("#z1"), `${packs}
          ${at("bags", 330, 280, "slate", "chia vào các túi bằng nhau")}
          ${at("same", 330, 370, "lime", "thừa số kẹo như nhau")}`);

        // ---------- s02: differences of neighbours ----------
        title($("#z2"), "t2", "amber", "Số lớn nhất, cùng số dư");
        el($("#z2"), `${packs}
          <div id="d1" class="eq" style="left:330px;top:235px">53 − 29 = 24</div>
          <div id="d2" class="eq" style="left:330px;top:320px">89 − 53 = 36</div>
          <div id="d3" class="eq" style="left:330px;top:410px"><span class="pill" style="padding:0 30px 4px">ƯCLN(24, 36) = <span class="slot"><span id="d3q" class="q">?</span><span id="d3a" class="am">12</span></span></span></div>`);

        // ---------- s03: the rule, then the check ----------
        title($("#z3"), "t3", "amber", "Số lớn nhất, cùng số dư");
        el($("#z3"), `
          ${at("u1", 330, 130, "slate", "29 &lt; 53 &lt; 89")}
          ${at("u2", 330, 215, "slate", "hiệu của hai số liền nhau: 24 và 36")}
          ${at("u3", 330, 300, "amber", "ƯCLN(24, 36) = 12")}
          ${at("u4", 330, 385, "amber", "mỗi túi nhiều nhất 12 cái")}
          <div id="k1" class="eq" style="left:330px;top:110px">29 = <span class="am">12</span> · 2 + <span class="lm">5</span></div>
          <div id="k2" class="eq" style="left:330px;top:195px">53 = <span class="am">12</span> · 4 + <span class="lm">5</span></div>
          <div id="k3" class="eq" style="left:330px;top:280px">89 = <span class="am">12</span> · 7 + <span class="lm">5</span></div>
          ${at("k4", 330, 385, "lime", "đều dư 5")}`);

        const bird = owl($("#owl-layer"), ["idle", "happy", "cheer"], { left: "34px", top: "366px" });
        scenes([["#s1", "s01-mo"], ["#s2", "s02-hieu"], ["#s3", "s03-thu"]]);

        {
          const sid = "s01-mo";
          hide(["#bagsc", "#samec"]);
          pose(bird, "happy", W(sid, "chào"));
          pose(bird, "idle", W(sid, "ba"));
          pop("#bagsc", W(sid, "túi"), { from: 0.6 });
          pop("#samec", W(sid, "thừa"), { from: 0.6 });
        }
        {
          const sid = "s02-hieu";
          hide(["#d1", "#d2", "#d3", "#d3a"]);
          pose(bird, "idle", start(sid));
          pop("#d1", W(sid, "53"), { from: 0.6 });
          pop("#d2", W(sid, "89"), { from: 0.6 });
          pop("#d3", W(sid, "bạn"), { from: 0.6 });
          tl.fromTo("#d3q", { autoAlpha: 1 }, { autoAlpha: 0, duration: 0.2, immediateRender: false }, W(sid, "12"));
          pop("#d3a", W(sid, "12"), { from: 0.4 });
          pose(bird, "happy", W(sid, "12"));
        }
        {
          const sid = "s03-thu";
          hide(["#u2c", "#u3c", "#u4c", "#k1", "#k2", "#k3", "#k4c"]);
          pose(bird, "idle", start(sid));
          pop("#u2c", W(sid, "tính"), { from: 0.6 });
          pop("#u3c", W(sid, "lớn", 2), { from: 0.6 });
          pop("#u4c", W(sid, "vậy"), { from: 0.6 });
          fade(["#u1c", "#u2c", "#u3c", "#u4c"], W(sid, "thử") - 0.2, 0.25);
          pop(["#k1", "#k2", "#k3"], W(sid, "thử"), { from: 0.6, stagger: 0.3 });
          pop("#k4c", W(sid, "dư", 2), { from: 0.6 });
          pose(bird, "cheer", W(sid, "dư", 2));
        }

        finish();
      })();
    </script>
  </body>
</html>
