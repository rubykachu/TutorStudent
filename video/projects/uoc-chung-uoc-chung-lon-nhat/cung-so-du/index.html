<!DOCTYPE html>
<!--
  Lesson video "Cùng số dư thì hiệu chia hết" (lesson
  uoc-chung-uoc-chung-lon-nhat): 17 and 29 sweets in bags of 4 both leave 1
  (lime, the remainder); without it 16 and 28 divide by 4 and so does the
  difference 12. Bags are slate, the remainder lime, as in the lesson. The
  title and the row of 17 are on screen from the first frame.
  Built by `pnpm video:build uoc-chung-uoc-chung-lon-nhat cung-so-du`,
  which injects window.TIMING.
-->
<html lang="vi">
  <head>
    <title>Cùng số dư thì hiệu chia hết</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="base.css" />
    <style>
      .teal { --c: var(--color-concept-teal); }
      .lime { --c: var(--color-concept-lime); }
      .slate { --c: var(--color-concept-slate); }
      .chip { font-size: 40px; }
      .lm { color: var(--color-concept-lime); }
      .q { color: var(--color-muted-foreground); }
      .slot { display: inline-grid; }
      .slot > * { grid-area: 1 / 1; }
      .eq { position: absolute; font: 800 76px / 1.1 "Baloo 2", sans-serif; white-space: nowrap; }
      .lab { position: absolute; width: 120px; text-align: right; font: 800 56px / 64px "Baloo 2", sans-serif; }
      .bag { position: absolute; height: 64px; width: 86px; border: 4px solid var(--color-concept-slate); border-radius: 14px; background: var(--color-surface); display: flex; align-items: center; justify-content: space-evenly; padding: 0 6px; }
      .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--color-concept-slate); flex: none; }
      .rest { position: absolute; width: 26px; height: 26px; border-radius: 50%; background: var(--color-concept-lime); }
      .arrows { position: absolute; font: 800 90px / 1 "Baloo 2", sans-serif; color: var(--color-muted-foreground); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="90" data-width="1280" data-height="720">
      <div id="stage" class="layer">
        <section id="s1" class="scene layer"><div id="z1" class="layer"></div></section>
        <section id="s2" class="scene layer"><div id="z2" class="layer"></div></section>
        <section id="s3" class="scene layer"><div id="z3" class="layer"></div></section>
      </div>
      <div id="owl-layer" class="layer"></div>
      <div id="fade" class="layer" style="background: var(--color-background)"></div>
    </div>

    <script src="gsap.min.js"></script>
    <script src="owl.js"></script>
    <script src="figures.js"></script>
    <script>/*TIMING:BEGIN*/window.TIMING=null;/*TIMING:END*/</script>
    <script src="runtime.js"></script>
    <script>
      (() => {
        const { tl, $, start, W, owl, pop, hide, fade, pose, scenes, finish } = window.LV;
        const X0 = 330;
        const chip = (id, cls, html) => `<span id="${id}" class="chip ${cls}">${html}</span>`;
        const el = (host, html) => {
          host.insertAdjacentHTML("beforeend", html);
        };
        const title = (host, id, cls, html) =>
          el(host, `<div class="abs" style="left:250px;top:28px">${chip(id, cls, html)}</div>`);
        const at = (id, left, top, cls, html) =>
          `<div id="${id}" class="abs" style="left:${left}px;top:${top}px">${chip(`${id}c`, cls, html)}</div>`;

        // A row of `bags` bags of 4 sweets plus one left over, with its number
        // (`now` before the leftover goes, `then` after). Returns the node ids.
        const row = (host, tag, top, bags, now, then) => {
          el(host, `<div class="lab" style="left:${X0 - 140}px;top:${top}px"><span class="slot"><span id="${tag}-now">${now}</span><span id="${tag}-then">${then}</span></span></div>`);
          const ids = [];
          for (let i = 0; i < bags; i++) {
            ids.push(`#${tag}-b${i}`);
            el(host, `<div id="${tag}-b${i}" class="bag" style="left:${X0 + i * 94}px;top:${top}px">${'<span class="dot"></span>'.repeat(4)}</div>`);
          }
          el(host, `<div id="${tag}-rest" class="rest" style="left:${X0 + bags * 94 + 4}px;top:${top + 19}px"></div>`);
          return ids;
        };

        // ---------- s01: 17 and 29 sweets in bags of 4 ----------
        title($("#z1"), "t1", "lime", "Cùng số dư");
        row($("#z1"), "a", 150, 4, 17, 16);
        const bagsB = row($("#z1"), "b", 290, 7, 29, 28);
        el($("#z1"), `${at("ra", X0 + 4 * 94 + 44, 150, "lime", "thừa 1")}${at("rb", X0 + 7 * 94 + 44, 290, "lime", "thừa 1")}`);

        // ---------- s02: take the remainder away ----------
        title($("#z2"), "t2", "lime", "Cùng số dư");
        row($("#z2"), "c", 150, 4, 17, 16);
        row($("#z2"), "d", 290, 7, 29, 28);
        el($("#z2"), `${at("rc", X0 + 4 * 94 + 44, 150, "lime", "thừa 1")}${at("rd", X0 + 7 * 94 + 44, 290, "lime", "thừa 1")}
          ${at("yc", 330, 390, "slate", "16 chia hết cho 4 ✓")}${at("yd", 330, 465, "slate", "28 chia hết cho 4 ✓")}`);

        // ---------- s03: the difference, then the rule ----------
        title($("#z3"), "t3", "lime", "Cùng số dư");
        el($("#z3"), `
          <div id="e1" class="eq" style="left:330px;top:110px">29 − 17 = <span class="slot"><span id="e1q" class="q">?</span><span id="e1a">12</span></span></div>
          ${at("e2", 330, 240, "slate", "12 chia hết cho 4 ✓")}
          ${at("r1", 330, 110, "lime", "cùng số dư")}
          <div id="r2" class="arrows" style="left:330px;top:175px">⇄</div>
          ${at("r3", 330, 300, "slate", "hiệu chia hết cho a")}`);

        const bird = owl($("#owl-layer"), ["idle", "happy", "cheer"], { left: "34px", top: "366px" });
        scenes([["#s1", "s01-mo"], ["#s2", "s02-bo"], ["#s3", "s03-hieu"]]);

        {
          const sid = "s01-mo";
          hide(["#a-rest", "#rac", "#b-then", "#a-then", ...bagsB, "#b-rest", "#b-now", "#rbc"]);
          pose(bird, "happy", W(sid, "chào"));
          pose(bird, "idle", W(sid, "chia"));
          pop("#a-rest", W(sid, "thừa"), { from: 0.4 });
          pop("#rac", W(sid, "thừa"), { from: 0.6 });
          pop(bagsB, W(sid, "29"), { from: 0.5, stagger: 0.1 });
          pop("#b-now", W(sid, "29"), { from: 0.5 });
          pop("#b-rest", W(sid, "thừa", 2), { from: 0.4 });
          pop("#rbc", W(sid, "thừa", 2), { from: 0.6 });
        }
        {
          const sid = "s02-bo";
          hide(["#c-then", "#d-then", "#ycc", "#ydc"]);
          pose(bird, "idle", start(sid));
          const gone = W(sid, "bỏ");
          fade(["#c-rest", "#rcc", "#d-rest", "#rdc"], gone, 0.3);
          tl.to(["#c-now", "#d-now"], { autoAlpha: 0, duration: 0.2 }, gone + 0.2);
          pop(["#c-then", "#d-then"], gone + 0.2, { from: 0.5 });
          pop("#ycc", W(sid, "có", 2), { from: 0.6 });
          pop("#ydc", W(sid, "28", 2), { from: 0.6 });
          pose(bird, "happy", W(sid, "28", 2));
        }
        {
          const sid = "s03-hieu";
          hide(["#e1a", "#e2c", "#r1c", "#r2", "#r3c"]);
          pose(bird, "idle", start(sid));
          tl.fromTo("#e1q", { autoAlpha: 1 }, { autoAlpha: 0, duration: 0.2, immediateRender: false }, W(sid, "12"));
          pop("#e1a", W(sid, "12"), { from: 0.4 });
          pop("#e2c", W(sid, "cũng"), { from: 0.6 });
          fade(["#e1", "#e2c"], W(sid, "chia", 2) - 0.2, 0.25);
          pop("#r1c", W(sid, "chia", 2), { from: 0.6 });
          pop("#r3c", W(sid, "hiệu", 2), { from: 0.6 });
          pop("#r2", W(sid, "hiệu", 3), { from: 0.6 });
          pose(bird, "cheer", W(sid, "chia", 2));
        }

        finish();
      })();
    </script>
  </body>
</html>
