<!doctype html>
<!--
  Lesson video "Tìm số trong khoảng khi chia còn dư" (lesson on-tap-chuong-2):
  a box of 100 to 140 marbles leaves 1 over in groups of 5, 6 and 10; take
  the 1 away, the rest is a common multiple (BCNN pink, multiples slate),
  add the 1 back and keep the one number inside the range (result yellow).
  Built by `pnpm video:build on-tap-chuong-2 khoang-bcnn`, which injects
  window.TIMING.
-->
<html lang="vi">
  <head>
    <title>Tìm số trong khoảng khi chia còn dư</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="base.css" />
    <style>
      .chip {
        font-size: 34px;
      }
      .ps {
        color: var(--color-concept-sky);
      }
      .cell {
        position: absolute;
        width: 134px;
        margin-left: -67px;
        text-align: center;
        font-size: 54px;
      }
      .lab {
        position: absolute;
        left: 40px;
      }
      .fx {
        font-size: 56px;
        padding: 8px 28px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="90"
      data-width="1280"
      data-height="720"
    >
      <div id="stage" class="layer">
        <section id="s1" class="scene layer">
          <div id="a0" class="row" style="top: 60px"></div>
          <div id="a1" class="row" style="top: 220px; gap: 24px"></div>
        </section>
        <section id="s2" class="scene layer">
          <div id="z2" class="layer"></div>
        </section>
        <section id="s3" class="scene layer">
          <div id="z3" class="layer"></div>
        </section>
        <section id="s4" class="scene layer">
          <div id="z4" class="layer"></div>
        </section>
      </div>
      <div id="owl-layer" class="layer"></div>
      <div
        id="fade"
        class="layer"
        style="background: var(--color-background)"
      ></div>
    </div>

    <script src="gsap.min.js"></script>
    <script src="owl.js"></script>
    <script src="figures.js"></script>
    <script>
      /*TIMING:BEGIN*/ window.TIMING = null; /*TIMING:END*/
    </script>
    <script src="runtime.js"></script>
    <script>
      (() => {
        const { tl, $, start, W, owl, pop, hide, pose, scenes, finish, color } =
          window.LV;
        const chip = (id, c, html, style = "") =>
          `<span id="${id}" class="chip" style="--c: var(--color-concept-${c}); ${style}">${html}</span>`;
        const el = (host, html) => host.insertAdjacentHTML("beforeend", html);

        // ---------- s01: the box and the groups ----------
        $("#a0").innerHTML = chip(
          "c0",
          "slate",
          "Hộp có từ 100 đến 140 viên bi",
          "font-size: 44px",
        );
        $("#a1").innerHTML = [5, 6, 10]
          .map((n) => chip(`g${n}`, "slate", `nhóm ${n} · thừa 1`))
          .join("");

        // ---------- s02: take the remainder away ----------
        const z2 = $("#z2");
        el(
          z2,
          `<div id="p1" class="row" style="top: 40px"><span class="math pill" style="font-size: 84px">n <span class="op">−</span> 1</span></div>
           <div class="row" style="top: 170px">${chip("p1t", "slate", "n là số bi, bớt đi 1 viên")}</div>
           <div id="p2" class="row" style="top: 270px; gap: 20px">${[5, 6, 10]
             .map((n) => chip(`h${n}`, "slate", `chia hết cho ${n}`, "font-size: 32px"))
             .join("")}</div>
           <div id="p3" class="row" style="top: 400px">${chip("p3c", "pink", "n − 1 là bội chung của 5, 6, 10", "font-size: 40px")}</div>`,
        );

        // ---------- s03: BCNN and its multiples ----------
        const z3 = $("#z3");
        el(
          z3,
          `<div id="q1" class="row" style="top: 20px">${chip("q1c", "pink", "BCNN(5, 6, 10)", "font-size: 40px")}</div>
           <div id="q2" class="row" style="top: 120px; gap: 30px"><span class="math card fx">5</span><span class="math card fx">6 <span class="op">=</span> <span class="ps">2</span> <span class="op">·</span> <span class="ps">3</span></span><span class="math card fx">10 <span class="op">=</span> <span class="ps">2</span> <span class="op">·</span> <span class="ps">5</span></span></div>
           <div id="q3" class="row" style="top: 250px"><span class="math pill" style="font-size: 76px; background: color-mix(in srgb, var(--color-concept-pink) 25%, var(--color-surface))"><span class="ps">2</span> <span class="op">·</span> <span class="ps">3</span> <span class="op">·</span> <span class="ps">5</span> <span class="op">=</span> <span style="color: var(--color-concept-pink)">30</span></span></div>`,
        );
        const COL = [440, 590, 740, 890, 1040];
        const bois = [30, 60, 90, 120, 150];
        const plus = [31, 61, 91, 121, 151];
        bois.forEach((m, i) => {
          el(
            z3,
            `<span id="m${m}" class="cell math pill" style="left: ${COL[i]}px; top: 390px">${m}</span>`,
          );
        });

        // ---------- s04: add 1 back, keep the one in the range ----------
        const z4 = $("#z4");
        el(
          z4,
          `<div class="lab" style="top: 50px">${chip("ra", "slate", "bội của 30", "font-size: 28px")}</div>
           <div class="lab" style="top: 170px">${chip("rb", "slate", "cộng 1", "font-size: 28px")}</div>`,
        );
        bois.forEach((m, i) => {
          el(
            z4,
            `<span id="u${m}" class="cell math pill" style="left: ${COL[i]}px; top: 30px">${m}</span>`,
          );
          el(
            z4,
            `<span id="v${plus[i]}" class="cell math pill" style="left: ${COL[i]}px; top: 150px">${plus[i]}</span>`,
          );
        });
        el(
          z4,
          `<div id="rg" class="row" style="top: 290px">${chip("rgc", "slate", "khoảng từ 100 đến 140", "font-size: 38px")}</div>
           <div id="fin" class="row" style="top: 400px"><span class="math pill" style="font-size: 76px">121 viên bi</span></div>`,
        );
        const bird = owl($("#owl-layer"), ["idle", "happy", "cheer"], {
          left: "34px",
          top: "366px",
        });

        scenes([
          ["#s1", "s01-mo"],
          ["#s2", "s02-bot"],
          ["#s3", "s03-bcnn"],
          ["#s4", "s04-khoang"],
        ]);
        pop(bird.wrap, 0.3, { from: 0.3 });

        {
          const sid = "s01-mo";
          hide(["#c0", "#g5", "#g6", "#g10"]);
          pose(bird, "happy", W(sid, "chào"));
          pop("#c0", W(sid, "hộp"), { from: 0.6 });
          pose(bird, "idle", W(sid, "hộp"));
          pop("#g5", W(sid, "5"), { from: 0.6 });
          pop("#g6", W(sid, "6"), { from: 0.6 });
          pop("#g10", W(sid, "10"), { from: 0.6 });
        }
        {
          const sid = "s02-bot";
          hide(["#p2", "#p3c", "#p1t"]);
          pose(bird, "idle", start(sid));
          pop("#p1", start(sid) + 0.2, { from: 0.6 });
          pop("#p1t", W(sid, "bớt"), { from: 0.6 });
          pop("#p2", W(sid, "số", 3), { from: 0.6 });
          pop("#p3c", W(sid, "vậy"), { from: 0.6 });
          pose(bird, "happy", W(sid, "vậy"));
        }
        {
          const sid = "s03-bcnn";
          hide(["#q1c", "#q2", "#q3", ...bois.map((m) => `#m${m}`)]);
          pose(bird, "idle", start(sid));
          pop("#q1c", W(sid, "tìm"), { from: 0.6 });
          pop("#q2", W(sid, "các"), { from: 0.6 });
          pop("#q3", W(sid, "bằng"), { from: 0.6 });
          bois.forEach((m) => {
            pop(`#m${m}`, W(sid, String(m), m === 30 ? 3 : 1), { from: 0.5 });
          });
        }
        {
          const sid = "s04-khoang";
          hide([
            "#ra",
            "#rb",
            "#rgc",
            "#fin",
            ...bois.map((m) => `#u${m}`),
            ...plus.map((m) => `#v${m}`),
          ]);
          pose(bird, "idle", start(sid));
          pop(["#ra", ...bois.map((m) => `#u${m}`)], start(sid) + 0.2, {
            from: 0.6,
            stagger: 0.05,
          });
          pop("#rb", W(sid, "cộng", 2), { from: 0.6 });
          plus.forEach((m, i) => {
            pop(`#v${m}`, W(sid, String(m)), { from: 0.5 });
          });
          pop("#rgc", W(sid, "khoảng", 2), { from: 0.6 });
          // Only 121 stays: the others dim, 121 turns yellow.
          const keep = W(sid, "121", 2);
          tl.to(
            [
              ...plus.filter((m) => m !== 121).map((m) => `#v${m}`),
              ...bois.map((m) => `#u${m}`),
            ],
            { opacity: 0.25, duration: 0.3 },
            keep,
          );
          tl.to(
            "#v121",
            { backgroundColor: color("highlight"), scale: 1.2, duration: 0.3 },
            keep,
          );
          pop("#fin", W(sid, "vậy"), { from: 0.6 });
          pose(bird, "cheer", W(sid, "vậy"));
        }

        finish();
      })();
    </script>
  </body>
</html>
