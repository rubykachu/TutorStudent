<!doctype html>
<!--
  Lesson video "Phép chia hết của số nguyên" (lesson phep-chia-het-uoc-va-boi-cua-mot-so-nguyen):
  12 = 3 · 4 (12 sweets for 3 children), then -12 = 3 · (-4) and
  18 = (-6) · (-3): if a = b · q with b not 0 and q an integer, a is divisible
  by b and a : b = q.
  Colours as in the lesson: the dividend (số bị chia) blue, the divisor (số
  chia) violet, the quotient (thương) amber.
  Built by `pnpm video:build phep-chia-het-uoc-va-boi-cua-mot-so-nguyen chia-het-so-nguyen`,
  which injects window.TIMING. The rule card carries `data-rule-text`: its
  text is the lesson's note word for word.
-->
<html lang="vi">
  <head>
    <title>Phép chia hết của số nguyên</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="base.css" />
    <style>
      .fm {
        font:
          800 84px / 1 "Baloo 2",
          sans-serif;
        white-space: nowrap;
      }
      .fm.small {
        font-size: 64px;
      }
      .dvd {
        color: var(--color-concept-blue);
      }
      .div {
        color: var(--color-concept-violet);
      }
      .quo {
        color: var(--color-concept-amber);
      }
      .op2 {
        color: var(--color-foreground);
      }
      .term {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
      }
      .term .cap {
        font:
          700 28px / 1.2 "Be Vietnam Pro",
          sans-serif;
      }
      .kids {
        gap: 40px;
        align-items: flex-start;
      }
      .kid {
        width: 190px;
        height: 170px;
        border: 5px solid var(--color-concept-violet);
        border-radius: 28px;
        background: var(--color-surface);
        display: grid;
        grid-template-columns: repeat(2, 56px);
        grid-template-rows: repeat(2, 56px);
        gap: 12px;
        justify-content: center;
        align-content: center;
      }
      .dot {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: var(--color-concept-blue);
      }
      .rule {
        position: absolute;
        left: 230px;
        width: 960px;
        top: 375px;
        padding: 18px 32px;
        font:
          600 30px / 1.4 "Be Vietnam Pro",
          sans-serif;
        text-align: center;
      }
      .ask {
        position: absolute;
        left: 0;
        width: 1280px;
        display: flex;
        justify-content: center;
      }
      .strike {
        position: relative;
      }
      .strike::after {
        content: "";
        position: absolute;
        left: -10px;
        right: -10px;
        top: 50%;
        height: 9px;
        border-radius: 5px;
        background: var(--color-concept-pink);
        transform: rotate(-8deg);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="70"
      data-width="1280"
      data-height="720"
    >
      <div id="stage" class="layer">
        <!-- scene 1: 12 sweets for 3 children, 12 = 3 · 4 -->
        <section id="s1" class="scene layer">
          <div class="row kids" style="top: 40px">
            <div id="k1" class="kid"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
            <div id="k2" class="kid"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
            <div id="k3" class="kid"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
          </div>
          <div class="row fm" style="top: 270px; align-items: flex-start">
            <div id="a1" class="term"><span class="dvd">12</span><span class="cap dvd">số bị chia</span></div>
            <span id="a1e" class="op2">=</span>
            <div id="a2" class="term"><span class="div">3</span><span class="cap div">số chia</span></div>
            <span id="a1m" class="op2">·</span>
            <div id="a3" class="term"><span class="quo">4</span><span class="cap quo">thương</span></div>
          </div>
        </section>

        <!-- scene 2: -12 = 3 · (-4), -12 : 3 = -4, the rule -->
        <section id="s2" class="scene layer">
          <div class="row fm" style="top: 30px">
            <span id="b1" class="dvd">−12</span>
            <span id="b1e" class="op2">=</span>
            <span id="b2" class="div">3</span>
            <span id="b1m" class="op2">·</span>
            <span id="b3" class="quo">(−4)</span>
          </div>
          <div class="row fm" style="top: 150px">
            <span id="c0" class="op2">(</span><span id="c1" class="dvd">−12</span><span id="c0r" class="op2">)</span>
            <span id="c1o" class="op2">:</span>
            <span id="c2" class="div">3</span>
            <span id="c1e" class="op2">=</span>
            <span id="c3" class="quo">−4</span>
          </div>
          <div id="rule2" class="card rule" data-rule-text>Nếu <span class="dvd">a</span> = <span class="div">b</span> · <span class="quo">q</span>, trong đó <span class="div">b</span> khác 0 và <span class="quo">q</span> là số nguyên, thì <span class="dvd">a</span> chia hết cho <span class="div">b</span> và <span class="dvd">a</span> : <span class="div">b</span> = <span class="quo">q</span>.</div>
        </section>

        <!-- scene 3: try 18 and -6 -->
        <section id="s3" class="scene layer">
          <div id="q3" class="ask" style="top: 40px">
            <span class="chip big" style="--c: var(--color-concept-violet); font: 800 52px/1.1 'Baloo 2', sans-serif; padding: 2px 26px 8px"><span class="dvd">18</span> chia hết cho <span class="div">−6</span> ?</span>
          </div>
          <div class="row fm small" style="top: 160px">
            <span id="d1" class="dvd">18</span>
            <span id="d1e" class="op2">=</span>
            <span id="d2" class="div">(−6)</span>
            <span id="d1m" class="op2">·</span>
            <span id="d3" class="quo">(−3)</span>
          </div>
          <div class="row fm small" style="top: 270px">
            <span id="e1" class="dvd">18</span>
            <span id="e1o" class="op2">:</span>
            <span id="e2" class="div">(−6)</span>
            <span id="e1e" class="op2">=</span>
            <span id="e3" class="quo">−3</span>
          </div>
        </section>

        <!-- scene 4: the divisor is never 0 -->
        <section id="s4" class="scene layer">
          <div class="row" style="top: 90px">
            <span id="n1" class="chip big" style="--c: var(--color-concept-violet); font: 800 72px/1.1 'Baloo 2', sans-serif; padding: 4px 34px 10px">số chia ≠ 0</span>
          </div>
          <div class="row fm" style="top: 260px">
            <span id="n2" class="strike"><span class="dvd">12</span> <span class="op2">:</span> <span class="div">0</span></span>
          </div>
        </section>
      </div>
      <div id="owl-layer" class="layer"></div>
      <div id="fade" class="layer" style="background: var(--color-background)"></div>
    </div>

    <script src="gsap.min.js"></script>
    <script src="owl.js"></script>
    <script src="figures.js"></script>
    <script>
      /*TIMING:BEGIN*/ window.TIMING = null; /*TIMING:END*/
    </script>
    <script src="runtime.js"></script>
    <script>
      (() => {
        const { $, start, W, owl, pop, hide, pose, scenes, finish } =
          window.LV;
        const bird = owl($("#owl-layer"), ["idle", "happy", "cheer"], {
          left: "30px",
          top: "385px",
          width: "150px",
          height: "150px",
        });

        scenes([
          ["#s1", "s01-keo"],
          ["#s2", "s02-so-nguyen"],
          ["#s3", "s03-thu"],
          ["#s4", "s04-nho"],
        ]);
        pop(bird.wrap, 0.3, { from: 0.3 });

        // ---------- scene 1: 12 sweets, 3 children, 4 each ----------
        {
          const sid = "s01-keo";
          hide(["#k1", "#k2", "#k3", "#a1", "#a1e", "#a2", "#a1m", "#a3"]);
          pose(bird, "happy", W(sid, "chào"));
          pose(bird, "idle", W(sid, "bạn"));
          pop(["#k1", "#k2", "#k3"], W(sid, "12"), { from: 0.4, stagger: 0.25 });
          pop("#a1", W(sid, "12", 2), { from: 0.6 });
          pop("#a1e", W(sid, "bằng"), { from: 0.6 });
          pop("#a2", W(sid, "3", 2), { from: 0.6 });
          pop("#a1m", W(sid, "nhân"), { from: 0.6 });
          pop("#a3", W(sid, "4", 2), { from: 0.6 });
          pose(bird, "happy", W(sid, "4", 2));
        }

        // ---------- scene 2: negative numbers, then the rule ----------
        {
          const sid = "s02-so-nguyen";
          hide(["#b1", "#b1e", "#b2", "#b1m", "#b3", "#c0", "#c1", "#c0r", "#c1o", "#c2", "#c1e", "#c3", "#rule2"]);
          pose(bird, "idle", start(sid));
          pop("#b1", W(sid, "12"), { from: 0.6 });
          pop("#b1e", W(sid, "bằng"), { from: 0.6 });
          pop("#b2", W(sid, "3"), { from: 0.6 });
          pop("#b1m", W(sid, "nhân"), { from: 0.6 });
          pop("#b3", W(sid, "4"), { from: 0.6 });
          pop(["#c0", "#c1", "#c0r"], W(sid, "12", 2), { from: 0.6, stagger: 0.1 });
          pop("#c1o", W(sid, "chia"), { from: 0.6 });
          pop("#c2", W(sid, "3", 2), { from: 0.6 });
          pop("#c1e", W(sid, "bằng", 2), { from: 0.6 });
          pop("#c3", W(sid, "4", 2), { from: 0.6 });
          pose(bird, "happy", W(sid, "4", 2));
          pose(bird, "idle", W(sid, "nếu"));
          pop("#rule2", W(sid, "nếu"), { from: 0.9 });
        }

        // ---------- scene 3: is 18 divisible by -6? ----------
        {
          const sid = "s03-thu";
          hide(["#q3", "#d1", "#d1e", "#d2", "#d1m", "#d3", "#e1", "#e1o", "#e2", "#e1e", "#e3"]);
          pose(bird, "idle", start(sid));
          pop("#q3", W(sid, "đoán"), { from: 0.6 });
          pop("#d1", W(sid, "18", 2), { from: 0.6 });
          pop("#d1e", W(sid, "bằng"), { from: 0.6 });
          pop("#d2", W(sid, "6", 2), { from: 0.6 });
          pop("#d1m", W(sid, "nhân"), { from: 0.6 });
          pop("#d3", W(sid, "3"), { from: 0.6 });
          pop("#e1", W(sid, "18", 3), { from: 0.6 });
          pop("#e1o", W(sid, "chia", 2), { from: 0.6 });
          pop("#e2", W(sid, "6", 3), { from: 0.6 });
          pop("#e1e", W(sid, "bằng", 2), { from: 0.6 });
          pop("#e3", W(sid, "3", 2), { from: 0.6 });
          pose(bird, "happy", W(sid, "3", 2));
        }

        // ---------- scene 4: remember ----------
        {
          const sid = "s04-nho";
          hide(["#n1", "#n2"]);
          pose(bird, "idle", start(sid));
          pop("#n1", W(sid, "số"), { from: 0.6 });
          pop("#n2", W(sid, "khác"), { from: 0.6 });
          pose(bird, "cheer", W(sid, "khác"));
        }

        finish();
      })();
    </script>
  </body>
</html>
