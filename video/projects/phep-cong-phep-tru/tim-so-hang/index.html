<!DOCTYPE html>
<!--
  Lesson video "Tìm số hạng chưa biết" (lesson phep-cong-phep-tru):
  ? + 35 = 82 as a bar (two addends under their sum), then 82 − 35 = 47 and
  the check 47 + 35 = 82. Colours follow the lesson's concepts: số hạng blue,
  tổng amber.
  Built by `pnpm video:build phep-cong-phep-tru tim-so-hang`, which injects
  window.TIMING (scene windows and spoken word times from script.json).
-->
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <title>Tìm số hạng chưa biết</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="base.css" />
    <style>
      /* The bar is 800 px wide: 47 and 35 of 82. */
      #bar { position: absolute; left: 240px; top: 40px; width: 800px; height: 100px; }
      .seg { position: absolute; top: 0; height: 100px; display: flex; align-items: center; justify-content: center; font: 800 64px / 1 "Baloo 2", sans-serif; color: var(--color-surface); background: var(--color-concept-blue); }
      #seg-u { left: 0; width: 458px; border-radius: 24px 0 0 24px; background: color-mix(in srgb, var(--color-concept-blue) 35%, var(--color-surface)); color: var(--color-concept-blue); border: 6px dashed var(--color-concept-blue); }
      #seg-k { left: 458px; width: 342px; border-radius: 0 24px 24px 0; border-left: 4px solid var(--color-surface); }
      #brace { position: absolute; left: 240px; top: 156px; width: 800px; }
      #total { position: absolute; left: 240px; top: 190px; width: 800px; text-align: center; font: 800 56px / 1 "Baloo 2", sans-serif; color: var(--color-concept-amber); }
      .blue { color: var(--color-concept-blue); }
      .amber { color: var(--color-concept-amber); }
      .tagslot { position: absolute; top: 400px; width: 200px; display: flex; justify-content: center; }
      .tagslot .chip { font-size: 30px; padding: 4px 16px; }
      .unk { display: inline-block; min-width: 1em; text-align: center; }
      .ok { color: var(--color-concept-teal); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="60" data-width="1280" data-height="720">
      <div id="stage" class="layer">
        <section id="work" class="scene layer">
          <div id="bar">
            <div id="seg-u" class="seg">?</div>
            <div id="seg-k" class="seg">35</div>
          </div>
          <div id="brace" class="brace" style="border-color: var(--color-concept-amber)"></div>
          <div id="total">82</div>
          <div id="eq" class="row math" style="top: 290px"></div>
        </section>
        <section id="s1" class="scene layer">
          <div id="title" class="row title" style="top: 280px">Tìm số hạng chưa biết</div>
        </section>
        <section id="s2" class="scene layer">
          <!-- name tags centred under "?", "35" and "82" of the equation -->
          <div class="tagslot" style="left: 364px"><span id="tag-u" class="chip" style="--c: var(--color-concept-blue)">số hạng</span></div>
          <div class="tagslot" style="left: 540px"><span id="tag-k" class="chip" style="--c: var(--color-concept-blue)">số hạng</span></div>
          <div class="tagslot" style="left: 712px"><span id="tag-t" class="chip" style="--c: var(--color-concept-amber)">tổng</span></div>
        </section>
        <section id="s3" class="scene layer">
          <div class="row" style="top: 410px">
            <span id="c-tong" class="chip" style="--c: var(--color-concept-amber)">tổng</span>
            <span class="math small">−</span>
            <span id="c-known" class="chip" style="--c: var(--color-concept-blue)">số hạng đã biết</span>
          </div>
        </section>
        <section id="s4" class="scene layer">
          <div id="calc" class="row math" style="top: 410px"></div>
        </section>
        <section id="s5" class="scene layer">
          <div id="back" class="row math" style="top: 410px"></div>
        </section>
        <section id="s6" class="scene layer">
          <div id="m-row1" class="row math" style="top: 90px"></div>
          <div id="m-row2" class="row math" style="top: 210px"></div>
          <div id="m-row3" class="row" style="top: 330px"><span class="math pill"></span></div>
        </section>
        <section id="s7" class="scene layer">
          <div id="rule-a" class="row" style="top: 120px"><span class="math pill">tổng − số hạng đã biết</span></div>
          <div id="rule-b" class="row" style="top: 290px"><span class="math pill" style="background: var(--color-muted)">= số hạng chưa biết</span></div>
        </section>
      </div>
      <div id="owl-layer" class="layer"></div>
      <div id="fade" class="layer" style="background: var(--color-background)"></div>
    </div>

    <script src="gsap.min.js"></script>
    <script src="owl.js"></script>
    <script src="figures.js"></script>
    <script>/*TIMING:BEGIN*/window.TIMING=null;/*TIMING:END*/</script>
    <script src="runtime.js"></script>
    <script>
      (() => {
        const { tl, $, start, end, W, op, owl, pop, rise, hide, pose, color, scenes, finish } = window.LV;
        const plus = op("+");
        const minus = op("−");
        const eq = op("=");

        // ---------- DOM ----------
        $("#eq").innerHTML = `<span id="e-u" class="blue unk">?</span>${plus}<span id="e-k" class="blue">35</span>${eq}<span id="e-t" class="amber">82</span>`;
        $("#calc").innerHTML = `<span class="amber">82</span>${minus}<span class="blue">35</span>${eq}<span class="pill" id="ans">47</span>`;
        $("#back").innerHTML = `<span class="blue">47</span>${plus}<span class="blue">35</span>${eq}<span class="amber">82</span><span class="ok" id="tick" style="margin-left: 24px">✓</span>`;
        $("#m-row1").innerHTML = `<span class="blue">?</span>${plus}<span class="blue">18</span>${eq}<span class="amber">60</span>`;
        $("#m-row2").innerHTML = `<span class="amber">60</span>${minus}<span class="blue">18</span>${eq}<span class="blue">42</span>`;
        $("#m-row3 .pill").textContent = "42";
        const bird = owl($("#owl-layer"), ["idle", "happy", "cheer"], { left: "34px", top: "390px" });

        // ---------- scene windows ----------
        scenes([
          ["#s1", "s01-de"],
          ["#s2", "s02-viet"],
          ["#s3", "s03-quy-tac"],
          ["#s4", "s04-tinh"],
          ["#s5", "s05-thu"],
          ["#s6", "s06-them"],
          ["#s7", "s07-nho"],
        ]);
        {
          // The bar and the equation stay from the story to the check.
          const el = $("#work");
          tl.fromTo(el, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.35, immediateRender: false }, 0);
          tl.to(el, { autoAlpha: 0, duration: 0.3 }, end("s05-thu") - 0.3);
        }
        pop(bird.wrap, 0.3, { from: 0.3 });

        // ---------- s01: Lan's money ----------
        {
          const sid = "s01-de";
          hide(["#seg-u", "#seg-k", "#brace", "#total", "#eq"]);
          pose(bird, "happy", W(sid, "chào"));
          // The title holds the greeting, then the bar takes over.
          hide(["#title"]);
          rise("#title", W(sid, "chào"));
          tl.to("#title", { autoAlpha: 0, duration: 0.3 }, W(sid, "lan", 1) - 0.3);
          pop("#seg-u", W(sid, "lan", 1), { from: 0.6 });
          pop("#seg-k", W(sid, "35"), { from: 0.6 });
          rise(["#brace", "#total"], W(sid, "82"));
        }

        // ---------- s02: write the addition, name the parts ----------
        {
          const sid = "s02-viet";
          pose(bird, "idle", start(sid));
          hide(["#tag-u", "#tag-k", "#tag-t"]);
          rise("#eq", W(sid, "viết"));
          rise("#tag-u", W(sid, "hạng", 1));
          rise("#tag-k", W(sid, "hạng", 2));
          rise("#tag-t", W(sid, "tổng"));
        }

        // ---------- s03: the rule ----------
        {
          const sid = "s03-quy-tac";
          hide(["#c-tong", "#s3 .math", "#c-known"]);
          rise("#c-tong", W(sid, "tổng"));
          rise("#s3 .math", W(sid, "trừ"));
          rise("#c-known", W(sid, "số", 2));
        }

        // ---------- s04: subtract ----------
        {
          const sid = "s04-tinh";
          hide(["#calc"]);
          rise("#calc", start(sid) + 0.2);
          // The answer takes the place of the question mark.
          hide(["#ans"]);
          pop("#ans", W(sid, "47", 1), { from: 0.6 });
          tl.to("#seg-u", { color: color("surface"), backgroundColor: color("concept-blue"), borderColor: color("concept-blue"), duration: 0.3 }, W(sid, "47", 1));
          tl.set("#seg-u", { textContent: "47" }, W(sid, "47", 1));
          tl.set("#e-u", { textContent: "47" }, W(sid, "47", 1));
          pose(bird, "happy", W(sid, "vậy"));
        }

        // ---------- s05: check ----------
        {
          const sid = "s05-thu";
          pose(bird, "idle", start(sid));
          hide(["#back", "#tick"]);
          rise("#back", W(sid, "thay"));
          pop("#tick", W(sid, "khớp"), { from: 0.4 });
        }

        // ---------- s06: one more ----------
        {
          const sid = "s06-them";
          hide(["#m-row1", "#m-row2", "#m-row3"]);
          rise("#m-row1", start(sid) + 0.3);
          rise("#m-row2", W(sid, "trừ"));
          pop("#m-row3", W(sid, "bằng", 2), { from: 0.4 });
          pose(bird, "happy", W(sid, "bằng", 2));
        }

        // ---------- s07: remember ----------
        {
          const sid = "s07-nho";
          hide(["#rule-a", "#rule-b"]);
          pop("#rule-a", W(sid, "lấy"), { from: 0.6 });
          pop("#rule-b", W(sid, "hạng", 2), { from: 0.6 });
          pose(bird, "cheer", W(sid, "nhớ"));
        }

        finish();
      })();
    </script>
  </body>
</html>
