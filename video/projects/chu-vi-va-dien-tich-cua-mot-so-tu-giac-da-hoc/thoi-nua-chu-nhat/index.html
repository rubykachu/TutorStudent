<!doctype html>
<!--
  Lesson video "Hình thoi là nửa hình chữ nhật" (lesson chu-vi-va-dien-tich-cua-mot-so-tu-giac-da-hoc):
  the rectangle drawn through the four vertices of a rhombus has the diagonals as its sides;
  the four triangles outside the rhombus turn in and fill it, so the rhombus is half of the
  rectangle and S = a · b : 2. The frames are the lesson's own figures (figures.tsx).
  Colours as in the lesson: area teal, diagonals amber.
  Built by `pnpm video:build chu-vi-va-dien-tich-cua-mot-so-tu-giac-da-hoc thoi-nua-chu-nhat`,
  which injects window.TIMING. The rule card carries `data-rule-text`: its text is a note
  of the lesson word for word.
-->
<html lang="vi">
  <head>
    <title>Hình thoi là nửa hình chữ nhật</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="base.css" />
    <style>
      .side {
        position: absolute;
        left: 860px;
        width: 380px;
        display: flex;
      }
      .side .chip {
        white-space: normal;
        font-size: 36px;
      }
      .rule {
        position: absolute;
        left: 100px;
        width: 1080px;
        top: 24px;
        padding: 16px 32px;
        font:
          600 30px / 1.4 "Be Vietnam Pro",
          sans-serif;
        text-align: center;
        box-sizing: border-box;
        text-wrap: balance;
      }
      .figure-wrap {
        left: 220px;
        top: 170px;
        width: 600px;
        height: 360px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="75"
      data-width="1280"
      data-height="720"
    >
      <div id="stage" class="layer">
        <section id="s1" class="scene layer">
          <div class="row title" style="top: 50px">Diện tích hình thoi</div>
          <div id="a1" class="side" style="top: 190px">
            <span class="chip" style="--c: var(--color-concept-amber)"
              >a = 8 cm</span
            >
          </div>
          <div id="b1" class="side" style="top: 290px">
            <span class="chip" style="--c: var(--color-concept-amber)"
              >b = 6 cm</span
            >
          </div>
        </section>
        <section id="s2" class="scene layer">
          <div id="a2" class="side" style="top: 190px">
            <span class="chip" style="--c: var(--color-concept-amber)"
              >a = 8 cm</span
            >
          </div>
          <div id="b2" class="side" style="top: 290px">
            <span class="chip" style="--c: var(--color-concept-amber)"
              >b = 6 cm</span
            >
          </div>
        </section>
        <section id="s3" class="scene layer">
          <div id="a3" class="side" style="top: 190px">
            <span class="chip" style="--c: var(--color-concept-amber)"
              >a = 8 cm</span
            >
          </div>
          <div id="b3" class="side" style="top: 290px">
            <span class="chip" style="--c: var(--color-concept-amber)"
              >b = 6 cm</span
            >
          </div>
        </section>
        <section id="s4" class="scene layer"></section>
        <section id="s5" class="scene layer"></section>
        <section id="s6" class="scene layer"></section>
        <section id="s7" class="scene layer"></section>
        <section id="s8" class="scene layer">
          <div id="mul8" class="side" style="top: 230px">
            <span class="chip" style="--c: var(--color-concept-teal)"
              >8 · 6 = 48</span
            >
          </div>
          <div id="area8" class="side" style="top: 340px">
            <span class="chip" style="--c: var(--color-concept-teal)"
              >S = 24 cm²</span
            >
          </div>
        </section>
        <section id="s9" class="scene layer">
          <div id="rule9" class="card rule" data-rule-text>
            Diện tích hình thoi bằng tích hai đường chéo, chia cho 2.
          </div>
        </section>
        <section id="s10" class="scene layer">
          <div id="n10" class="side" style="top: 250px">
            <span class="chip" style="--c: var(--color-concept-teal)"
              >S = a · b : 2</span
            >
          </div>
        </section>
      </div>
      <div id="owl-layer" class="layer"></div>
      <div
        id="fade"
        class="layer"
        style="background: var(--color-background)"
      ></div>
    </div>

    <script src="gsap.min.js"></script>
    <script src="owl.js"></script>
    <script src="figures.js"></script>
    <script>
      /*TIMING:BEGIN*/ window.TIMING = null; /*TIMING:END*/
    </script>
    <script src="runtime.js"></script>
    <script>
      (() => {
        const { $, start, W, owl, figure, pop, hide, pose, scenes, finish, tl } =
          window.LV;
        const bird = owl($("#owl-layer"), ["idle", "happy", "cheer"], {
          left: "30px",
          top: "385px",
          width: "150px",
          height: "150px",
        });
        pop(bird.wrap, 0.3, { from: 0.3 });

        scenes(
          [
            ["#s1", "s01-chao"],
            ["#s2", "s02-hop"],
            ["#s3", "s03-hoi"],
            ["#s4", "s04-xoay"],
            ["#s5", "s05-lap"],
            ["#s6", "s06-nua"],
            ["#s7", "s07-hoi"],
            ["#s8", "s08-kq"],
            ["#s9", "s09-quy-tac"],
            ["#s10", "s10-nho"],
          ],
          { leave: 0 },
        );

        // A scene shows the frame it is about from its first frame; a frame
        // changes when the words that make it are said.
        const frames = (section, names) => figure($(section), names, {});
        const show = (f, name, t) => {
          for (const [key, layer] of Object.entries(f.layers)) {
            tl.set(layer, { opacity: key === name ? 1 : 0 }, t);
          }
        };

        {
          const sid = "s01-chao";
          frames("#s1", ["rhombus-1"]);
          hide(["#a1", "#b1"]);
          pose(bird, "happy", W(sid, "chào"));
          pose(bird, "idle", W(sid, "bạn"));
          pop("#a1", W(sid, "8"), { from: 0.6 });
          pop("#b1", W(sid, "6"), { from: 0.6 });
        }
        {
          const sid = "s02-hop";
          const f = frames("#s2", ["rhombus-1", "rhombus-2"]);
          pose(bird, "idle", start(sid));
          show(f, "rhombus-2", W(sid, "vẽ"));
        }
        {
          const sid = "s03-hoi";
          frames("#s3", ["rhombus-2"]);
          pose(bird, "idle", start(sid));
        }
        {
          const sid = "s04-xoay";
          const f = frames("#s4", ["rhombus-3", "rhombus-4"]);
          pose(bird, "idle", start(sid));
          show(f, "rhombus-4", W(sid, "xoay"));
        }
        {
          const sid = "s05-lap";
          frames("#s5", ["rhombus-4"]);
          pose(bird, "idle", start(sid));
        }
        {
          const sid = "s06-nua";
          frames("#s6", ["rhombus-5"]);
          pose(bird, "idle", start(sid));
        }
        {
          const sid = "s07-hoi";
          frames("#s7", ["rhombus-5"]);
          pose(bird, "idle", start(sid));
        }
        {
          const sid = "s08-kq";
          frames("#s8", ["rhombus-5"]);
          hide(["#mul8", "#area8"]);
          pose(bird, "idle", start(sid));
          pop("#mul8", W(sid, "nhân"), { from: 0.6 });
          pop("#area8", W(sid, "một"), { from: 0.6 });
          pose(bird, "cheer", W(sid, "một"));
        }
        {
          const sid = "s09-quy-tac";
          frames("#s9", ["rhombus-5"]);
          hide(["#rule9"]);
          pose(bird, "idle", start(sid));
          pop("#rule9", start(sid) + 0.1, { from: 0.9 });
        }
        {
          const sid = "s10-nho";
          frames("#s10", ["rhombus-5"]);
          hide(["#n10"]);
          pose(bird, "idle", start(sid));
          pop("#n10", W(sid, "nhân"), { from: 0.6 });
          pose(bird, "cheer", W(sid, "nhớ"));
        }

        finish();
      })();
    </script>
  </body>
</html>
