<!doctype html>
<!--
  Lesson video "Cắt hình bình hành thành hình chữ nhật" (lesson chu-vi-va-dien-tich-cua-mot-so-tu-giac-da-hoc):
  the height of a parallelogram is cut off as a triangle and slid across to make a rectangle
  of the same area, so S = a · h. The cut parallelogram frames are the lesson's own figures
  (figures.tsx). Colours as in the lesson: area teal, height violet.
  Built by `pnpm video:build chu-vi-va-dien-tich-cua-mot-so-tu-giac-da-hoc cat-binh-hanh`,
  which injects window.TIMING. The rule card carries `data-rule-text`: its text is a note
  of the lesson word for word.
-->
<html lang="vi">
  <head>
    <title>Cắt hình bình hành thành hình chữ nhật</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="base.css" />
    <style>
      .side {
        position: absolute;
        left: 860px;
        width: 380px;
        display: flex;
      }
      .side .chip {
        white-space: normal;
        font-size: 36px;
      }
      .rule {
        position: absolute;
        left: 100px;
        width: 1080px;
        top: 24px;
        padding: 16px 32px;
        font:
          600 30px / 1.4 "Be Vietnam Pro",
          sans-serif;
        text-align: center;
        box-sizing: border-box;
        text-wrap: balance;
      }
      .figure-wrap {
        left: 220px;
        top: 170px;
        width: 600px;
        height: 360px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="75"
      data-width="1280"
      data-height="720"
    >
      <div id="stage" class="layer">
        <section id="s1" class="scene layer">
          <div class="row title" style="top: 50px">Cắt hình bình hành</div>
        </section>
        <section id="s2" class="scene layer"></section>
        <section id="s3" class="scene layer">
          <div id="h3" class="side" style="top: 250px">
            <span class="chip" style="--c: var(--color-concept-violet)"
              >h = 3 cm</span
            >
          </div>
        </section>
        <section id="s4" class="scene layer"></section>
        <section id="s5" class="scene layer"></section>
        <section id="s6" class="scene layer">
          <div id="rect6" class="side" style="top: 250px">
            <span class="chip" style="--c: var(--color-concept-teal)"
              >6 cm và 3 cm</span
            >
          </div>
        </section>
        <section id="s7" class="scene layer"></section>
        <section id="s8" class="scene layer">
          <div id="mul8" class="side" style="top: 230px">
            <span class="chip" style="--c: var(--color-concept-teal)"
              >6 · 3 = 18</span
            >
          </div>
          <div id="area8" class="side" style="top: 340px">
            <span class="chip" style="--c: var(--color-concept-teal)"
              >S = 18 cm²</span
            >
          </div>
        </section>
        <section id="s9" class="scene layer">
          <div id="rule9" class="card rule" data-rule-text>
            Diện tích hình bình hành bằng cạnh đáy nhân với chiều cao.
          </div>
        </section>
        <section id="s10" class="scene layer">
          <div id="n10" class="side" style="top: 250px">
            <span class="chip" style="--c: var(--color-concept-teal)"
              >S = a · h</span
            >
          </div>
        </section>
      </div>
      <div id="owl-layer" class="layer"></div>
      <div
        id="fade"
        class="layer"
        style="background: var(--color-background)"
      ></div>
    </div>

    <script src="gsap.min.js"></script>
    <script src="owl.js"></script>
    <script src="figures.js"></script>
    <script>
      /*TIMING:BEGIN*/ window.TIMING = null; /*TIMING:END*/
    </script>
    <script src="runtime.js"></script>
    <script>
      (() => {
        const { $, start, W, owl, figure, pop, hide, pose, scenes, finish, tl } =
          window.LV;
        const bird = owl($("#owl-layer"), ["idle", "happy", "cheer"], {
          left: "30px",
          top: "385px",
          width: "150px",
          height: "150px",
        });
        pop(bird.wrap, 0.3, { from: 0.3 });

        scenes(
          [
            ["#s1", "s01-chao"],
            ["#s2", "s02-hoi"],
            ["#s3", "s03-cao"],
            ["#s4", "s04-cat"],
            ["#s5", "s05-truot"],
            ["#s6", "s06-ghep"],
            ["#s7", "s07-hoi"],
            ["#s8", "s08-kq"],
            ["#s9", "s09-quy-tac"],
            ["#s10", "s10-nho"],
          ],
          { leave: 0 },
        );

        // A scene shows the frame it is about from its first frame; a frame
        // changes when the words that make it are said.
        const frames = (section, names) => figure($(section), names, {});
        const show = (f, name, t) => {
          for (const [key, layer] of Object.entries(f.layers)) {
            tl.set(layer, { opacity: key === name ? 1 : 0 }, t);
          }
        };

        {
          const sid = "s01-chao";
          frames("#s1", ["para-1"]);
          pose(bird, "happy", W(sid, "chào"));
          pose(bird, "idle", W(sid, "bạn"));
        }
        {
          const sid = "s02-hoi";
          frames("#s2", ["para-1"]);
          pose(bird, "idle", start(sid));
        }
        {
          const sid = "s03-cao";
          frames("#s3", ["para-2"]);
          hide(["#h3"]);
          pose(bird, "idle", start(sid));
          pop("#h3", W(sid, "dài"), { from: 0.6 });
        }
        {
          const sid = "s04-cat";
          frames("#s4", ["para-3"]);
          pose(bird, "idle", start(sid));
        }
        {
          const sid = "s05-truot";
          const f = frames("#s5", ["para-3", "para-4"]);
          pose(bird, "idle", start(sid));
          show(f, "para-4", W(sid, "trượt"));
        }
        {
          const sid = "s06-ghep";
          frames("#s6", ["para-4"]);
          hide(["#rect6"]);
          pose(bird, "idle", start(sid));
          pop("#rect6", W(sid, "hình", 2), { from: 0.6 });
        }
        {
          const sid = "s07-hoi";
          frames("#s7", ["para-4"]);
          pose(bird, "idle", start(sid));
        }
        {
          const sid = "s08-kq";
          const f = frames("#s8", ["para-4", "para-5"]);
          hide(["#mul8", "#area8"]);
          pose(bird, "idle", start(sid));
          show(f, "para-5", W(sid, "bằng"));
          pop("#mul8", W(sid, "nhân"), { from: 0.6 });
          pop("#area8", W(sid, "diện"), { from: 0.6 });
          pose(bird, "cheer", W(sid, "diện"));
        }
        {
          const sid = "s09-quy-tac";
          frames("#s9", ["para-5"]);
          hide(["#rule9"]);
          pose(bird, "idle", start(sid));
          pop("#rule9", start(sid) + 0.1, { from: 0.9 });
        }
        {
          const sid = "s10-nho";
          frames("#s10", ["para-2"]);
          hide(["#n10"]);
          pose(bird, "idle", start(sid));
          pop("#n10", W(sid, "chiều"), { from: 0.6 });
          pose(bird, "cheer", W(sid, "nhớ"));
        }

        finish();
      })();
    </script>
  </body>
</html>
