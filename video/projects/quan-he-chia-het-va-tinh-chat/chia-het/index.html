<!DOCTYPE html>
<!--
  Lesson video "Chia hết là gì" (lesson quan-he-chia-het-va-tinh-chat): 12
  sweets shared evenly into bags of 3 leave none over, so 12 is divisible by
  3 and 12 = 3 · 4; then 14 sweets leave 2 over (pink), so 14 is not divisible
  by 3. Lesson colours: số bị chia blue, số chia violet, thương amber, with a
  shape each (● ▲ ■). Built by
  `pnpm video:build quan-he-chia-het-va-tinh-chat chia-het`, which injects
  window.TIMING (scene windows and spoken word times).
-->
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <title>Chia hết là gì</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="base.css" />
    <style>
      .candy { position: absolute; z-index: 2; width: 34px; height: 34px; border-radius: 10px; background: var(--color-concept-sky); border: 4px solid var(--color-surface); box-shadow: 0 0 0 3px var(--color-concept-sky); }
      .bag { position: absolute; top: 360px; width: 170px; height: 76px; background: var(--color-surface); border: 6px solid var(--color-border); border-radius: 22px 22px 40px 40px; }
      .blabel { position: absolute; top: 444px; width: 170px; text-align: center; font: 700 28px / 1.2 "Be Vietnam Pro", sans-serif; color: var(--color-muted-foreground); }
      .dv { display: inline-block; height: 1em; width: 0.5em; vertical-align: -0.1em; overflow: visible; }
      .cb { color: var(--color-concept-blue); } .cv { color: var(--color-concept-violet); } .ca { color: var(--color-concept-amber); } .cp { color: var(--color-concept-pink); } .ct { color: var(--color-concept-teal); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="60" data-width="1280" data-height="720">
      <div id="stage" class="layer">
        <section id="work" class="scene layer"></section>
        <section id="s1" class="scene layer">
          <div id="title" class="row title" style="top: 200px">Chia hết là gì?</div>
        </section>
        <section id="s3" class="scene layer">
          <div id="r1" class="row" style="top: 150px"></div>
          <div id="r2" class="row math" style="top: 232px"></div>
        </section>
        <section id="s4" class="scene layer">
          <div id="work2" class="abs"></div>
          <div id="p1" class="row" style="top: 190px"><span class="math pill"></span></div>
        </section>
        <section id="s5" class="scene layer">
          <div id="n1" class="row" style="top: 90px"></div>
          <div id="n2" class="row" style="top: 270px"></div>
        </section>
      </div>
      <div id="owl-layer" class="layer"></div>
      <div id="fade" class="layer" style="background: var(--color-background)"></div>
    </div>

    <script src="gsap.min.js"></script>
    <script src="owl.js"></script>
    <script src="figures.js"></script>
    <script>/*TIMING:BEGIN*/window.TIMING=null;/*TIMING:END*/</script>
    <script src="runtime.js"></script>
    <script>
      (() => {
        const { tl, $, start, end, W, owl, pop, rise, hide, pose, color, scenes, finish } = window.LV;
        const sp = (cls, id, html) => `<span id="${id}" class="${cls}">${html}</span>`;
        // The lesson's sign "chia hết cho": three dots; crossed by a slash when not.
        const dv = (not) =>
          `<svg class="dv" viewBox="0 0 30 60"><g fill="currentColor"><circle cx="15" cy="10" r="6"/><circle cx="15" cy="30" r="6"/><circle cx="15" cy="50" r="6"/></g>${not ? '<line x1="0" y1="62" x2="30" y2="-2" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>' : ""}</svg>`;
        const chip = (id, c, html) => `<span id="${id}" class="chip" style="--c: var(--color-concept-${c})">${html}</span>`;

        // ---------- DOM ----------
        // n sweets in rows of 7 at the top, 4 bags of 3 below; the first 12
        // sweets go 3 per bag, any others stay (pink).
        const BAG_LEFT = (i) => 264 + i * 194;
        const build = (root, prefix, n) => {
          const cols = Math.ceil(n / 2);
          const home = (k) => ({ x: 640 - (cols * 44) / 2 + (k % cols) * 44, y: 40 + Math.floor(k / cols) * 44 });
          const list = [];
          for (let k = 0; k < n; k++) {
            const c = document.createElement("div");
            c.className = `candy ${prefix}candy`;
            c.id = `${prefix}c${k}`;
            c.style.left = `${home(k).x}px`;
            c.style.top = `${home(k).y}px`;
            root.append(c);
            list.push(c);
          }
          for (let i = 0; i < 4; i++) {
            const b = document.createElement("div");
            b.className = `bag ${prefix}bag`;
            b.style.left = `${BAG_LEFT(i)}px`;
            root.append(b);
            const l = document.createElement("div");
            l.className = `blabel ${prefix}bag`;
            l.style.left = `${BAG_LEFT(i)}px`;
            l.textContent = `túi ${i + 1}`;
            root.append(l);
          }
          // Puts the sweets of bag i into it at time t.
          const fill = (i, t) => {
            for (let j = 0; j < 3; j++) {
              const k = i * 3 + j;
              tl.to(list[k], { x: BAG_LEFT(i) + 14 + j * 46 - home(k).x, y: 372 - home(k).y, duration: 0.45, ease: "power2.inOut" }, t + j * 0.1);
            }
          };
          return { list, fill };
        };
        const A = build($("#work"), "a", 12);
        const B = build($("#work2"), "b", 14);
        $("#r1").innerHTML = `${chip("x1", "blue", "● số bị chia")}${chip("x2", "teal", `${dv(false)} chia hết cho`)}${chip("x3", "violet", "▲ số chia")}`;
        $("#r2").innerHTML = `${sp("cb", "e1", "12")}<span id="e2" class="op">=</span>${sp("cv", "e3", "3")}<span id="e4" class="op">·</span>${sp("ca", "e5", "4")}`;
        $("#p1 .pill").innerHTML = `<span class="cb">14</span><span class="ct"> ${dv(true)} </span><span class="cv">3</span>`;
        $("#n1").innerHTML = `${chip("m1", "teal", "không còn thừa")}<span id="m2" class="math small">→</span><span id="m3" class="math small"><span class="cb">12</span> <span class="ct">${dv(false)}</span> <span class="cv">3</span></span>`;
        $("#n2").innerHTML = `${chip("o1", "pink", "◆ còn thừa")}<span id="o2" class="math small">→</span><span id="o3" class="math small"><span class="cb">14</span> <span class="ct">${dv(true)}</span> <span class="cv">3</span></span>`;
        const bird = owl($("#owl-layer"), ["idle", "happy", "cheer"], { left: "34px", top: "390px" });
        const pink = color("concept-pink");

        // ---------- scene windows ----------
        scenes([
          ["#s1", "s01-de"],
          ["#s3", "s03-luat"],
          ["#s4", "s04-thu"],
          ["#s5", "s05-nho"],
        ]);
        {
          // Sweets and bags stay from the question to the rule.
          const el = $("#work");
          tl.fromTo(el, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.35, immediateRender: false }, W("s01-de", "12"));
          tl.to(el, { autoAlpha: 0, duration: 0.3 }, end("s03-luat") - 0.3);
        }
        pop(bird.wrap, 0.3, { from: 0.3 });

        // ---------- s01: 12 sweets, bags of 3 ----------
        {
          const sid = "s01-de";
          hide(["#title", ".abag", ".bbag"]);
          hide(A.list);
          pose(bird, "happy", W(sid, "chào"));
          rise("#title", W(sid, "chào"));
          tl.to("#title", { autoAlpha: 0, duration: 0.3 }, W(sid, "bạn", 2) - 0.3);
          pop(".acandy", W(sid, "12"), { from: 0.4, stagger: 0.04 });
          pop(".abag", W(sid, "túi"), { from: 0.6, stagger: 0.15 });
        }

        // ---------- s02: one bag after another ----------
        {
          const sid = "s02-chia";
          pose(bird, "idle", start(sid));
          A.fill(0, W(sid, "một"));
          A.fill(1, W(sid, "hai"));
          A.fill(2, W(sid, "ba"));
          A.fill(3, W(sid, "bốn"));
          pose(bird, "happy", W(sid, "vừa"));
        }

        // ---------- s03: divisible, and 12 = 3 · 4 ----------
        {
          const sid = "s03-luat";
          pose(bird, "idle", start(sid));
          hide(["#x1", "#x2", "#x3", "#e1", "#e2", "#e3", "#e4", "#e5"]);
          pop("#x1", W(sid, "bị"), { from: 0.6 });
          pop("#x2", W(sid, "hết"), { from: 0.6 });
          pop("#x3", W(sid, "chia", 3), { from: 0.6 });
          pop("#e1", W(sid, "bị", 2), { from: 0.6 });
          pop("#e2", W(sid, "bằng"), { from: 0.6 });
          pop("#e3", W(sid, "chia", 4), { from: 0.6 });
          pop("#e4", W(sid, "nhân"), { from: 0.6 });
          pop("#e5", W(sid, "thương"), { from: 0.6 });
          pose(bird, "happy", W(sid, "lần"));
        }

        // ---------- s04: 14 sweets leave 2 over ----------
        {
          const sid = "s04-thu";
          pose(bird, "idle", start(sid));
          hide(["#p1", ".bbag"]);
          hide(B.list);
          pop(".bcandy", W(sid, "14"), { from: 0.4, stagger: 0.04 });
          pop(".bbag", W(sid, "túi"), { from: 0.6, stagger: 0.15 });
          const t0 = W(sid, "bốn");
          const t1 = Math.max(t0 + 2, W(sid, "12") - 0.3);
          for (let i = 0; i < 4; i++) B.fill(i, t0 + (i * (t1 - t0)) / 4);
          B.list.slice(12).forEach((c, i) => {
            tl.to(c, { boxShadow: `0 0 0 3px ${pink}`, backgroundColor: pink, duration: 0.3 }, W(sid, "thừa") + i * 0.15);
          });
          pop("#p1", W(sid, "không", 1), { from: 0.6 });
          pose(bird, "happy", W(sid, "không"));
        }

        // ---------- s05: remember ----------
        {
          const sid = "s05-nho";
          hide(["#m1", "#m2", "#m3", "#o1", "#o2", "#o3"]);
          pose(bird, "cheer", W(sid, "nhớ"));
          pop("#m1", W(sid, "đều"), { from: 0.6 });
          pop("#m2", W(sid, "là"), { from: 0.6 });
          pop("#m3", W(sid, "hết"), { from: 0.6 });
          pop("#o1", W(sid, "còn"), { from: 0.6 });
          pop("#o2", W(sid, "là", 2), { from: 0.6 });
          pop("#o3", W(sid, "không", 2), { from: 0.6 });
        }

        finish();
      })();
    </script>
  </body>
</html>
