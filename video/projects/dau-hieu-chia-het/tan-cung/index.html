<!DOCTYPE html>
<!--
  Lesson video "Nhìn chữ số tận cùng" (lesson dau-hieu-chia-het): the last digit
  (teal) of 4 376, 16 marbles in bags of 2, the digits 0 2 4 6 8 against
  1 3 5 7 9, 135 thousand dong into 5 thousand notes, then 0 and 5. Built by
  `pnpm video:build dau-hieu-chia-het tan-cung`, which injects window.TIMING
  (scene windows and spoken word times).
-->
<html lang="vi">
  <head>
    <title>Nhìn chữ số tận cùng</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="base.css" />
    <style>
      .tiles { display: flex; gap: 12px; }
      .dg { display: inline-flex; align-items: center; justify-content: center; width: 96px; height: 120px; border-radius: 20px; background: var(--color-surface); border: 6px solid var(--color-border); font: 800 76px / 1 "Baloo 2", sans-serif; color: var(--color-foreground); }
      .dg.t { border-color: var(--color-concept-teal); color: var(--color-concept-teal); }
      .dg.p { border-color: var(--color-concept-pink); color: var(--color-concept-pink); }
      .dg.l { border-color: var(--color-concept-lime); color: var(--color-foreground); }
      .dg.q { border-style: dashed; border-color: var(--color-concept-pink); color: var(--color-concept-pink); }
      .dg.sm { width: 74px; height: 92px; font-size: 56px; border-width: 5px; border-radius: 16px; }
      .dv { display: inline-block; height: 1em; width: 0.5em; vertical-align: -0.1em; overflow: visible; }
      .cb { color: var(--color-concept-blue); } .cv { color: var(--color-concept-violet); } .ca { color: var(--color-concept-amber); } .cp { color: var(--color-concept-pink); } .ct { color: var(--color-concept-teal); } .cl { color: var(--color-concept-lime); }
      .shift { padding-left: 240px; }
      .mb { position: absolute; top: 14px; width: 30px; height: 30px; border-radius: 50%; background: var(--color-concept-sky); border: 3px solid var(--color-surface); box-shadow: 0 0 0 3px var(--color-concept-sky); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="90" data-width="1280" data-height="720">
      <div id="stage" class="layer">
        <section id="s1" class="scene layer">
          <div id="a1" class="row" style="top: 120px"></div>
          <div id="a2" class="row" style="top: 290px"></div>
        </section>
        <section id="s2" class="scene layer">
          <div id="b1" class="row" style="top: 80px"></div>
          <div id="bags" class="abs" style="left: 300px; top: 230px"></div>
          <div id="b2" class="row shift" style="top: 400px"></div>
          <div id="c1" class="row shift" style="top: 90px"></div>
          <div id="c2" class="row shift" style="top: 290px"></div>
        </section>
        <section id="s3" class="scene layer">
          <div id="d1" class="row" style="top: 110px"></div>
          <div id="d2" class="row shift" style="top: 280px"></div>
          <div id="x1" class="row shift" style="top: 110px"></div>
          <div id="x2" class="row shift" style="top: 280px"></div>
        </section>
        <section id="s4" class="scene layer">
          <div id="f1" class="row shift" style="top: 90px"></div>
          <div id="f2" class="row shift" style="top: 280px"></div>
        </section>
      </div>
      <div id="owl-layer" class="layer"></div>
      <div id="fade" class="layer" style="background: var(--color-background)"></div>
    </div>

    <script src="gsap.min.js"></script>
    <script src="owl.js"></script>
    <script src="figures.js"></script>
    <script>/*TIMING:BEGIN*/window.TIMING=null;/*TIMING:END*/</script>
    <script src="runtime.js"></script>
    <script>
      (() => {
        const { tl, $, start, W, owl, pop, hide, pose, scenes, finish } = window.LV;
        // The lesson's sign "chia hết cho": three dots; crossed by a slash when not.
        const dv = (not) =>
          `<svg class="dv" viewBox="0 0 30 60"><g fill="currentColor"><circle cx="15" cy="10" r="6"/><circle cx="15" cy="30" r="6"/><circle cx="15" cy="50" r="6"/></g>${not ? '<line x1="0" y1="62" x2="30" y2="-2" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>' : ""}</svg>`;
        const chip = (id, c, html) => `<span id="${id}" class="chip" style="--c: var(--color-concept-${c})">${html}</span>`;
        // Digit tiles: one tile per [digit, class] pair, ids <prefix>0, <prefix>1, ...
        const tiles = (prefix, list, small) =>
          `<div class="tiles">${list.map(([d, c], i) => `<span id="${prefix}${i}" class="dg ${c || ""}${small ? " sm" : ""}">${d}</span>`).join("")}</div>`;

        // ---------- DOM ----------
        $("#a1").innerHTML = tiles("g", [["4"], ["3"], ["7"], ["6", "t"]]);
        $("#a2").innerHTML = `${chip("g-chip", "teal", "■ chữ số tận cùng")}`;
        // s02: 16 marbles in 8 bags of 2, then the digits that divide by 2.
        $("#b1").innerHTML = tiles("h", [["1"], ["6", "t"]]);
        const bags = $("#bags");
        for (let i = 0; i < 8; i++) {
          const b = document.createElement("div");
          b.className = "bagx";
          b.style.cssText = `position:absolute;left:${i * 114}px;top:0;width:104px;height:70px;background:var(--color-surface);border:6px solid var(--color-border);border-radius:18px 18px 34px 34px;`;
          b.innerHTML = `<span class="mb" style="left:14px"></span><span class="mb" style="left:52px"></span>`;
          bags.append(b);
        }
        $("#b2").innerHTML = `<span class="math pill"><span class="ct">16</span> ${dv(false)} <span>2</span></span>`;
        $("#c1").innerHTML = `${tiles("e", [["0", "t"], ["2", "t"], ["4", "t"], ["6", "t"], ["8", "t"]], true)}${chip("e-chip", "teal", `${dv(false)} chia hết cho 2`)}`;
        $("#c2").innerHTML = `${tiles("o", [["1", "p"], ["3", "p"], ["5", "p"], ["7", "p"], ["9", "p"]], true)}${chip("o-chip", "pink", `${dv(true)} không chia hết cho 2`)}`;
        // s03: 135 thousand dong into 5 thousand notes, then 0 and 5, then 137.
        $("#d1").innerHTML = tiles("m", [["1"], ["3"], ["5", "t"]]);
        $("#d2").innerHTML = `<span class="math pill"><span>135</span> ${dv(false)} <span>5</span></span>`;
        $("#x1").innerHTML = `${tiles("r", [["0", "t"], ["5", "t"]], true)}${chip("r-chip", "teal", `${dv(false)} chia hết cho 5`)}`;
        $("#x2").innerHTML = `${tiles("w", [["1"], ["3"], ["7", "p"]], true)}<span id="x2p" class="math pill"><span>137</span> <span class="cp">${dv(true)}</span> <span>5</span></span>`;
        // s04: summary
        $("#f1").innerHTML = `${chip("n1", "teal", `${dv(false)} cho 2`)}${tiles("u", [["0", "t"], ["2", "t"], ["4", "t"], ["6", "t"], ["8", "t"]], true)}`;
        $("#f2").innerHTML = `${chip("n2", "teal", `${dv(false)} cho 5`)}${tiles("v", [["0", "t"], ["5", "t"]], true)}`;
        const bird = owl($("#owl-layer"), ["idle", "happy", "cheer"], { left: "34px", top: "390px" });

        scenes([["#s1", "s01-tan-cung"], ["#s2", "s02-hai"], ["#s3", "s03-nam"], ["#s4", "s04-nho"]]);
        pop(bird.wrap, 0.3, { from: 0.3 });
        const ids = (p, n) => Array.from({ length: n }, (_, i) => `#${p}${i}`);

        // ---------- s01: the last digit ----------
        {
          const sid = "s01-tan-cung";
          hide(["#g-chip", ...ids("g", 4)]);
          pose(bird, "happy", W(sid, "chào"));
          pop(ids("g", 4), W(sid, "376"), { from: 0.4, stagger: 0.12 });
          tl.to("#g3", { scale: 1.12, yoyo: true, repeat: 1, duration: 0.2 }, W(sid, "phải"));
          pop("#g-chip", W(sid, "tận"), { from: 0.6 });
          pose(bird, "idle", W(sid, "ví"));
        }

        // ---------- s02: divisible by 2 ----------
        {
          const sid = "s02-hai";
          hide(["#b2", ...ids("h", 2), ".bagx", ".mb", "#e-chip", "#o-chip", ...ids("e", 5), ...ids("o", 5)]);
          pose(bird, "idle", start(sid));
          pop(ids("h", 2), W(sid, "16"), { from: 0.4, stagger: 0.12 });
          pop(".bagx", W(sid, "túi"), { from: 0.6, stagger: 0.12 });
          pop(".mb", W(sid, "viên"), { from: 0.3, stagger: 0.06 });
          pop("#b2", W(sid, "hết"), { from: 0.6 });
          pose(bird, "happy", W(sid, "hết"));
          // Rule sentences: the practice rows replace the marbles.
          tl.to(["#b1", "#bags", "#b2"], { autoAlpha: 0, duration: 0.3 }, W(sid, "số", 1) - 0.1);
          [["0", 1, 0], ["2", 2, 1], ["4", 1, 2], ["6", 1, 3], ["8", 1, 4]].forEach(([d, n, i]) => {
            pop(`#e${i}`, W(sid, d, n), { from: 0.4 });
          });
          pop("#e-chip", W(sid, "thì", 1), { from: 0.6 });
          [["1", 0], ["3", 1], ["5", 2], ["7", 3], ["9", 4]].forEach(([d, i]) => {
            pop(`#o${i}`, W(sid, d, 1), { from: 0.4 });
          });
          pop("#o-chip", W(sid, "thì", 2), { from: 0.6 });
        }

        // ---------- s03: divisible by 5 ----------
        {
          const sid = "s03-nam";
          hide([...ids("m", 3), "#d2", "#r-chip", ...ids("r", 2), ...ids("w", 3), "#x2p"]);
          pose(bird, "idle", start(sid));
          pop(ids("m", 3), W(sid, "135", 1), { from: 0.4, stagger: 0.12 });
          pop("#d2", W(sid, "hết", 1), { from: 0.6 });
          pose(bird, "happy", W(sid, "hết", 1));
          tl.to(["#d1", "#d2"], { autoAlpha: 0, duration: 0.3 }, W(sid, "số", 4) - 0.1);
          pop("#r0", W(sid, "0"), { from: 0.4 });
          pop("#r1", W(sid, "5", 4), { from: 0.4 });
          pop("#r-chip", W(sid, "thì"), { from: 0.6 });
          pop(ids("w", 3), W(sid, "137"), { from: 0.4, stagger: 0.12 });
          pop("#x2p", W(sid, "không"), { from: 0.6 });
        }

        // ---------- s04: remember ----------
        {
          const sid = "s04-nho";
          hide(["#n1", "#n2", ...ids("u", 5), ...ids("v", 2)]);
          pose(bird, "cheer", W(sid, "nhớ"));
          pop("#n1", W(sid, "chia"), { from: 0.6 });
          pop(ids("u", 5), W(sid, "tận", 1), { from: 0.4, stagger: 0.3 });
          pop("#n2", W(sid, "chia", 2), { from: 0.6 });
          pop(ids("v", 2), W(sid, "tận", 2), { from: 0.4, stagger: 0.3 });
        }

        finish();
      })();
    </script>
  </body>
</html>
