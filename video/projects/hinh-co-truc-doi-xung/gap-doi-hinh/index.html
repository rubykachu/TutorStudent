<!doctype html>
<!--
  Lesson video "Gấp hình để tìm trục đối xứng" (lesson hinh-co-truc-doi-xung): a paper arrowhead is
  folded along a line d; when the two halves cover each other exactly, d is an axis of symmetry;
  a fold along another line leaves one half sticking out. Colours as in the lesson: axis of
  symmetry pink, dashed.
  Built by `pnpm video:build hinh-co-truc-doi-xung gap-doi-hinh`, which injects window.TIMING.
  The rule card carries `data-rule-text`: its text is a sentence of the lesson's note word for word.
-->
<html lang="vi">
  <head>
    <title>Gấp hình để tìm trục đối xứng</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="base.css" />
    <style>
      .kite {
        position: absolute;
        left: 200px;
        top: 80px;
        width: 440px;
        height: 440px;
      }
      .side {
        position: absolute;
        left: 700px;
        width: 520px;
        display: flex;
      }
      .side .chip {
        white-space: normal;
        font-size: 36px;
      }
      .rule {
        position: absolute;
        left: 700px;
        width: 520px;
        top: 110px;
        padding: 22px 28px;
        font:
          600 34px / 1.45 "Be Vietnam Pro",
          sans-serif;
        box-sizing: border-box;
        text-wrap: balance;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="60"
      data-width="1280"
      data-height="720"
    >
      <div id="stage" class="layer">
        <svg id="kiteA" class="kite" viewBox="-185 -212 370 394" role="img">
          <title>Miếng giấy hình mũi tên gấp theo đường d</title>
          <g id="a-left">
            <polygon points="0,-130 -85,-30 0,140" fill="#0369a1" fill-opacity="0.35" stroke="#0369a1" stroke-width="4" stroke-linejoin="round" />
          </g>
          <g id="a-right">
            <polygon points="0,-130 85,-30 0,140" fill="#4d7c0f" fill-opacity="0.35" stroke="#4d7c0f" stroke-width="4" stroke-linejoin="round" />
          </g>
          <line id="a-axis" x1="0" y1="-150" x2="0" y2="170" stroke="#db2777" stroke-width="5" stroke-dasharray="14 10" stroke-linecap="round" />
          <text id="a-d" x="14" y="-146" fill="#db2777" font-family="Baloo 2" font-weight="800" font-size="44">d</text>
        </svg>
        <svg id="kiteB" class="kite" viewBox="-185 -212 370 394" role="img">
          <title>Miếng giấy hình mũi tên gấp theo đường nằm ngang</title>
          <g id="b-up">
            <polygon points="0,-130 85,-30 -85,-30" fill="#0369a1" fill-opacity="0.35" stroke="#0369a1" stroke-width="4" stroke-linejoin="round" />
          </g>
          <g id="b-down">
            <polygon points="-85,-30 85,-30 0,140" fill="#4d7c0f" fill-opacity="0.35" stroke="#4d7c0f" stroke-width="4" stroke-linejoin="round" />
          </g>
          <line id="b-axis" x1="-130" y1="-30" x2="130" y2="-30" stroke="#475569" stroke-width="5" stroke-dasharray="14 10" stroke-linecap="round" />
          <text id="b-d" x="136" y="-18" fill="#475569" font-family="Baloo 2" font-weight="800" font-size="44">e</text>
        </svg>
        <section id="s1" class="scene layer">
          <div class="row title" style="top: 24px; left: 640px; width: 640px">Gấp hình, tìm trục</div>
        </section>
        <section id="s2" class="scene layer">
          <div id="t2" class="side" style="top: 250px">
            <span class="chip" style="--c: var(--color-concept-pink)">Đường d, nét đứt</span>
          </div>
        </section>
        <section id="s3" class="scene layer">
          <div id="t3" class="side" style="top: 250px">
            <span class="chip" style="--c: var(--color-concept-pink)">Hai nửa chồng khít</span>
          </div>
        </section>
        <section id="s4" class="scene layer">
          <div id="rule4" class="card rule" data-rule-text>
            Gấp hình theo đường thẳng d, nếu hai nửa chồng khít nhau thì d là trục đối xứng.
          </div>
        </section>
        <section id="s5" class="scene layer">
          <div id="t5" class="side" style="top: 250px">
            <span class="chip" style="--c: var(--color-concept-slate)">Hai nửa lệch nhau ✕</span>
          </div>
        </section>
      </div>
      <div id="owl-layer" class="layer"></div>
      <div
        id="fade"
        class="layer"
        style="background: var(--color-background)"
      ></div>
    </div>

    <script src="gsap.min.js"></script>
    <script src="owl.js"></script>
    <script src="figures.js"></script>
    <script>
      /*TIMING:BEGIN*/ window.TIMING = null; /*TIMING:END*/
    </script>
    <script src="runtime.js"></script>
    <script>
      (() => {
        const { $, start, W, owl, pop, hide, pose, scenes, finish, tl } =
          window.LV;
        const bird = owl($("#owl-layer"), ["idle", "happy", "cheer"], {
          left: "30px",
          top: "385px",
          width: "150px",
          height: "150px",
        });
        pop(bird.wrap, 0.3, { from: 0.3 });

        scenes(
          [
            ["#s1", "s01-chao"],
            ["#s2", "s02-hoi"],
            ["#s3", "s03-gap"],
            ["#s4", "s04-quy-tac"],
            ["#s5", "s05-thu"],
          ],
          { leave: 0 },
        );
        const show = (target, t) =>
          tl.fromTo(
            target,
            { autoAlpha: 0 },
            { autoAlpha: 1, duration: 0.4, immediateRender: false },
            t,
          );
        // Folds a half over a line: it flips about `origin` (a point on the line).
        const fold = (half, axis, origin, t) =>
          tl.fromTo(
            half,
            { [axis]: 1, svgOrigin: origin },
            {
              [axis]: -1,
              svgOrigin: origin,
              duration: 1.4,
              ease: "power2.inOut",
              immediateRender: false,
            },
            t,
          );

        hide(["#kiteB", "#a-axis", "#a-d", "#t2", "#t3", "#rule4", "#t5"]);

        {
          const sid = "s01-chao";
          pose(bird, "happy", W(sid, "chào"));
          pose(bird, "idle", W(sid, "bạn"));
        }
        {
          const sid = "s02-hoi";
          show(["#a-axis", "#a-d"], W(sid, "kẻ"));
          pop("#t2", W(sid, "kẻ"), { from: 0.6 });
        }
        {
          const sid = "s03-gap";
          fold("#a-right", "scaleX", "0 0", W(sid, "đè"));
          pop("#t3", W(sid, "chồng"), { from: 0.6 });
          pose(bird, "happy", W(sid, "chồng"));
        }
        {
          const sid = "s04-quy-tac";
          pop("#rule4", start(sid) + 0.1, { from: 0.9 });
          pose(bird, "idle", start(sid));
        }
        {
          const sid = "s05-thu";
          // the second figure: same paper, other fold line
          tl.set("#kiteA", { autoAlpha: 0 }, start(sid));
          tl.set("#kiteB", { autoAlpha: 1 }, start(sid));
          fold("#b-down", "scaleY", "0 -30", W(sid, "dưới"));
          pop("#t5", W(sid, "lệch"), { from: 0.6 });
          pose(bird, "idle", start(sid));
          // the last sentence goes back to the pink line d: its folded halves still cover each other
          tl.set("#kiteB", { autoAlpha: 0 }, W(sid, "chỉ"));
          tl.set("#kiteA", { autoAlpha: 1 }, W(sid, "chỉ"));
          tl.set("#t5", { autoAlpha: 0 }, W(sid, "chỉ"));
        }

        finish();
      })();
    </script>
  </body>
</html>
