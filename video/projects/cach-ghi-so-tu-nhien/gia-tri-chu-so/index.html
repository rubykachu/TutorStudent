<!doctype html>
<!--
  Lesson video "Giá trị của chữ số" (lesson cach-ghi-so-tu-nhien): the number
  3 507 as in the lesson, digits in blue tiles (chữ số), places in violet
  (hàng), the value of a digit in pink (giá trị của chữ số) = the digit times
  1, 10, 100... Then 3 570: the same digit 7 one place to the left.
  Built by `pnpm video:build cach-ghi-so-tu-nhien gia-tri-chu-so`, which
  injects window.TIMING.
-->
<html lang="vi">
  <head>
    <title>Giá trị của chữ số</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="base.css" />
    <style>
      .blue {
        --c: var(--color-concept-blue);
      }
      .pink {
        --c: var(--color-concept-pink);
      }
      .slate {
        --c: var(--color-concept-slate);
      }
      .tile {
        position: absolute;
        top: 110px;
        width: 120px;
        height: 140px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 5px solid var(--color-concept-blue);
        border-radius: 22px;
        background: color-mix(
          in srgb,
          var(--color-concept-blue) 15%,
          var(--color-surface)
        );
        color: var(--color-concept-blue);
        font:
          800 92px / 1 "Baloo 2",
          sans-serif;
      }
      .nm {
        position: absolute;
        top: 262px;
        width: 150px;
        text-align: center;
        color: var(--color-concept-violet);
        font:
          800 32px / 1.1 "Be Vietnam Pro",
          sans-serif;
      }
      .nm .mk {
        display: block;
        font-size: 20px;
        margin-bottom: 2px;
      }
      .mul {
        position: absolute;
        top: 342px;
        width: 150px;
        text-align: center;
        color: var(--color-concept-violet);
        font:
          800 40px / 1 "Baloo 2",
          sans-serif;
      }
      .val {
        position: absolute;
        top: 406px;
        width: 150px;
        text-align: center;
        color: var(--color-concept-pink);
        font:
          800 66px / 1 "Baloo 2",
          sans-serif;
      }
      .val .d {
        font-size: 34px;
        vertical-align: 12px;
        margin-right: 6px;
      }
      .val.old {
        text-decoration: line-through;
        text-decoration-thickness: 6px;
        opacity: 0.8;
      }
      .qm {
        position: absolute;
        top: 406px;
        width: 150px;
        text-align: center;
        color: var(--color-concept-pink);
        font:
          800 72px / 1 "Baloo 2",
          sans-serif;
      }
      .chip {
        font-size: 38px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="90"
      data-width="1280"
      data-height="720"
    >
      <div id="stage" class="layer">
        <section id="s1" class="scene layer">
          <div class="row" style="top: 20px; left: 100px">
            <span id="c1" class="chip slate"></span>
          </div>
          <div id="z1" class="layer"></div>
        </section>
        <section id="s2" class="scene layer">
          <div class="row" style="top: 20px; left: 100px">
            <span id="c2" class="chip pink">◆ giá trị = chữ số nhân 1, 10, 100…</span>
          </div>
          <div id="z2" class="layer"></div>
        </section>
        <section id="s3" class="scene layer">
          <div class="row" style="top: 20px; left: 100px">
            <span id="c3" class="chip slate">Đổi thành số 3 570</span>
          </div>
          <div id="z3" class="layer"></div>
        </section>
      </div>
      <div id="owl-layer" class="layer"></div>
      <div
        id="fade"
        class="layer"
        style="background: var(--color-background)"
      ></div>
    </div>

    <script src="gsap.min.js"></script>
    <script src="owl.js"></script>
    <script src="figures.js"></script>
    <script>
      /*TIMING:BEGIN*/ window.TIMING = null; /*TIMING:END*/
    </script>
    <script src="runtime.js"></script>
    <script>
      (() => {
        const { $, color, tl, start, W, owl, pop, fade, hide, tint, pose, scenes, finish } =
          window.LV;
        const el = (host, html) => host.insertAdjacentHTML("beforeend", html);

        // Four tiles, a wider gap after the thousands digit: "3 507".
        const NAMES = ["nghìn", "trăm", "chục", "đơn vị"];
        const MULS = ["× 1 000", "× 100", "× 10", "× 1"];
        const tileLeft = (i) => 440 + i * 150 + (i >= 1 ? 40 : 0);
        const tile = (host, id, digit, i) =>
          el(
            host,
            `<div id="${id}" class="tile" style="left: ${tileLeft(i)}px">${digit}</div>`,
          );
        const names = (host, p) => {
          NAMES.forEach((n, i) => {
            el(
              host,
              `<div id="${p}n${i}" class="nm" style="left: ${tileLeft(i) - 15}px"><span class="mk">▲</span>${n}</div>`,
            );
          });
        };
        const muls = (host, p) => {
          MULS.forEach((m, i) => {
            el(
              host,
              `<div id="${p}m${i}" class="mul" style="left: ${tileLeft(i) - 15}px">${m}</div>`,
            );
          });
        };
        const val = (host, id, i, html, extra = "") =>
          el(
            host,
            `<div id="${id}" class="val ${extra}" style="left: ${tileLeft(i) - 15}px"><span class="d">◆</span>${html}</div>`,
          );
        // The tile being talked about is yellow with a dark border; the
        // others return to their blue tint.
        const tintOf = (() => {
          const hex = (name) =>
            [0, 2, 4].map((k) =>
              Number.parseInt(color(name).replace("#", "").slice(k, k + 2), 16),
            );
          const blue = hex("concept-blue");
          const surface = hex("surface");
          return `rgb(${blue.map((c, k) => Math.round(c * 0.15 + surface[k] * 0.85)).join(",")})`;
        })();
        const pick = (id, t) => {
          tint(id, t);
          tl.to(id, { borderColor: color("foreground"), duration: 0.3 }, t);
        };
        const unpick = (id, t) => {
          tl.to(id, { backgroundColor: tintOf, borderColor: color("concept-blue"), duration: 0.3 }, t);
        };

        // ---------- s01: 3 507, where the 5 and the 7 stand ----------
        $("#c1").innerHTML = "Bạn cú đi được 3 507 bước";
        [3, 5, 0, 7].forEach((d, i) => {
          tile($("#z1"), `at${i}`, d, i);
        });
        names($("#z1"), "a");

        // ---------- s02: the value of the 5 and of the 7 ----------
        [3, 5, 0, 7].forEach((d, i) => {
          tile($("#z2"), `bt${i}`, d, i);
        });
        names($("#z2"), "b");
        muls($("#z2"), "b");
        el($("#z2"), `<div id="bq" class="qm" style="left: ${tileLeft(1) - 15}px">?</div>`);
        val($("#z2"), "b5", 1, "500");
        val($("#z2"), "b7", 3, "7");

        // ---------- s03: 3 570, the 7 moves one place left ----------
        // Starts as 3 507 (the 0 and the 7 swap when "570" is read).
        [3, 5, 0, 7].forEach((d, i) => {
          tile($("#z3"), `ct${i}`, d, i);
        });
        names($("#z3"), "c");
        muls($("#z3"), "c");
        val($("#z3"), "c7", 3, "7", "old");
        val($("#z3"), "c70", 2, "70");

        const bird = owl($("#owl-layer"), ["idle", "happy", "cheer"], {
          left: "34px",
          top: "366px",
        });

        scenes([
          ["#s1", "s01-so"],
          ["#s2", "s02-gia-tri"],
          ["#s3", "s03-doi-hang"],
        ]);
        pop(bird.wrap, 0.3, { from: 0.3 });

        {
          const sid = "s01-so";
          hide(["#c1", ...[0, 1, 2, 3].flatMap((i) => [`#at${i}`, `#an${i}`])]);
          pose(bird, "happy", W(sid, "chào"));
          pop("#c1", W(sid, "bạn", 2), { from: 0.6 });
          [0, 1, 2, 3].forEach((i) => {
            pop(`#at${i}`, W(sid, "3") + i * 0.18, { from: 0.5 });
          });
          pose(bird, "idle", W(sid, "chữ"));
          pick("#at1", W(sid, "5"));
          pop("#an1", W(sid, "trăm"), { from: 0.5 });
          unpick("#at1", W(sid, "7") - 0.05);
          pick("#at3", W(sid, "7"));
          pop("#an3", W(sid, "đơn"), { from: 0.5 });
          // The other two places appear last, so the two asked about come first.
          pop(["#an0", "#an2"], W(sid, "vị") + 0.3, { from: 0.5, stagger: 0.2 });
        }
        {
          const sid = "s02-gia-tri";
          hide([
            "#c2",
            "#bq",
            "#b5",
            "#b7",
            ...[0, 1, 2, 3].flatMap((i) => [`#bn${i}`, `#bm${i}`]),
          ]);
          pose(bird, "idle", start(sid));
          pop([0, 1, 2, 3].map((i) => `#bn${i}`), start(sid) + 0.2, { from: 0.6 });
          pick("#bt1", W(sid, "5"));
          pop("#bq", W(sid, "bạn"), { from: 0.4 });
          pop("#c2", W(sid, "muốn"), { from: 0.6 });
          pop("#bm3", W(sid, "1"), { from: 0.5 });
          pop("#bm2", W(sid, "10"), { from: 0.5 });
          pop("#bm1", W(sid, "100"), { from: 0.5 });
          fade("#bq", W(sid, "500") - 0.05, 0.2);
          pose(bird, "happy", W(sid, "500"));
          pop("#b5", W(sid, "500"), { from: 0.5 });
          unpick("#bt1", W(sid, "7") - 0.05);
          pick("#bt3", W(sid, "7"));
          pop("#b7", W(sid, "7", 2), { from: 0.5 });
        }
        {
          const sid = "s03-doi-hang";
          hide([
            "#c3",
            "#c7",
            "#c70",
            ...[0, 1, 2, 3].flatMap((i) => [`#cn${i}`, `#cm${i}`]),
          ]);
          pose(bird, "idle", start(sid));
          pop("#c3", W(sid, "đổi"), { from: 0.6 });
          pop([0, 1, 2, 3].map((i) => `#cn${i}`), start(sid) + 0.2, { from: 0.6 });
          // 3 507 becomes 3 570: the 7 and the 0 swap places.
          const swap = W(sid, "570");
          tl.to("#ct2", { x: 150, duration: 0.6, ease: "power2.inOut" }, swap);
          tl.to("#ct3", { x: -150, duration: 0.6, ease: "power2.inOut" }, swap);
          pick("#ct3", W(sid, "7"));
          pose(bird, "happy", W(sid, "7"));
          pop("#c7", W(sid, "không"), { from: 0.5 });
          pop("#c70", W(sid, "70"), { from: 0.5 });
          pop("#cm3", W(sid, "1"), { from: 0.5 });
          pop("#cm2", W(sid, "sang", 2), { from: 0.5 });
          pop("#cm1", W(sid, "thêm"), { from: 0.5 });
          pop("#cm0", W(sid, "0"), { from: 0.5 });
          pose(bird, "cheer", W(sid, "cùng"));
        }

        finish();
      })();
    </script>
  </body>
</html>
