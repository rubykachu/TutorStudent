<!DOCTYPE html>
<!--
  Lesson video "Nhóm các thừa số cho dễ nhẩm" (lesson phep-nhan-phep-chia):
  36 · 25 is split as 9 · 4 · 25, the pair 4 · 25 = 100 is ringed in lime (the
  colour of "kết hợp") and multiplied first, giving 9 · 100 = 900; 12 · 25 is
  the learner's try. Built by
  `pnpm video:build phep-nhan-phep-chia nhom-thua-so`, which injects
  window.TIMING (scene windows and spoken word times from script.json).
-->
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <title>Nhóm các thừa số cho dễ nhẩm</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="base.css" />
    <style>
      .ring { display: inline-flex; align-items: center; gap: 18px; padding: 0 12px 6px; margin: 0 -12px; border: 4px solid transparent; border-radius: 24px; }
      #w2 .pill { display: inline-flex; align-items: center; gap: 18px; }
      .tagcard { display: inline-flex; flex-direction: column; align-items: center; padding: 14px 30px 18px; background: var(--color-surface); border: 4px solid var(--color-border); border-radius: 24px; }
      .tagcard .v { font: 800 64px / 1.1 "Baloo 2", sans-serif; }
      .tagcard .u { font: 600 26px / 1.2 "Be Vietnam Pro", sans-serif; color: var(--color-muted-foreground); }
      .res { color: var(--color-concept-amber); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="60" data-width="1280" data-height="720">
      <div id="stage" class="layer">
        <section id="s1" class="scene layer">
          <div id="title" class="row title" style="top: 300px">Nhóm các thừa số để nhân nhẩm</div>
          <div id="tags" class="row" style="top: 40px; gap: 40px">
            <span id="tg1" class="tagcard"><span class="v">25</span><span class="u">khay trứng</span></span>
            <span id="tg2" class="tagcard"><span class="v">36</span><span class="u">quả mỗi khay</span></span>
          </div>
          <div id="ask" class="row math" style="top: 250px"></div>
        </section>
        <section id="s2" class="scene layer">
          <div id="r1" class="row math" style="top: 40px"></div>
          <div id="r2" class="row math" style="top: 160px"></div>
          <div id="r3" class="row math" style="top: 290px"></div>
        </section>
        <section id="s3" class="scene layer">
          <div id="law" class="row math" style="top: 70px"></div>
          <div id="law-res" class="row" style="top: 210px"><span class="math pill">30</span></div>
          <div id="law-chip" class="row" style="top: 350px"><span class="chip" style="--c: var(--color-concept-lime)">tính chất kết hợp</span></div>
        </section>
        <section id="s4" class="scene layer">
          <div id="u1" class="row math" style="top: 40px"></div>
          <div id="u2" class="row math" style="top: 160px"></div>
          <div id="u3" class="row" style="top: 285px"><span class="math pill">900</span></div>
          <div id="u4" class="row tag" style="top: 420px; color: var(--color-muted-foreground)">quả trứng</div>
        </section>
        <section id="s5" class="scene layer">
          <div id="v1" class="row math" style="top: 20px"></div>
          <div id="v2" class="row math" style="top: 125px"></div>
          <div id="v3" class="row math" style="top: 230px"></div>
          <div id="v4" class="row" style="top: 350px"><span class="math pill">300</span></div>
        </section>
        <section id="s6" class="scene layer">
          <div id="w1" class="row" style="top: 110px"><span id="c-group" class="chip" style="--c: var(--color-concept-lime)">nhóm các thừa số</span><span id="wa" class="math small">→</span><span id="c-round" class="chip" style="--c: var(--color-concept-amber)">ra số tròn</span><span id="wb" class="math small">→</span><span id="c-mul" class="chip" style="--c: var(--color-concept-blue)">rồi mới nhân</span></div>
          <div id="w2" class="row" style="top: 290px"><span class="math pill"></span></div>
        </section>
      </div>
      <div id="owl-layer" class="layer"></div>
      <div id="fade" class="layer" style="background: var(--color-background)"></div>
    </div>

    <script src="gsap.min.js"></script>
    <script src="owl.js"></script>
    <script src="figures.js"></script>
    <script>/*TIMING:BEGIN*/window.TIMING=null;/*TIMING:END*/</script>
    <script src="runtime.js"></script>
    <script>
      (() => {
        const { tl, $, start, W, op, owl, pop, rise, hide, pose, color, scenes, finish } = window.LV;
        const dot = op("·");
        const eq = op("=");
        const ring = (id, html) => `<span id="${id}" class="ring">${html}</span>`;

        // ---------- DOM ----------
        $("#ask").innerHTML = `36${dot}25<span id="ask-q" class="op" style="margin-left: 24px">?</span>`;
        $("#r1").innerHTML = `36${dot}25`;
        $("#r2").innerHTML = `9${dot}${ring("rg", `4${dot}25`)}`;
        $("#r3").innerHTML = `4${dot}25${eq}<span id="r3res" class="pill">100</span>`;
        $("#law").innerHTML = `${ring("la", `(2${dot}3)`)}${dot}5<span id="law-eq" class="op">=</span>2${dot}${ring("lb", `(3${dot}5)`)}`;
        $("#u1").innerHTML = `9${dot}${ring("ug", `(4${dot}25)`)}`;
        $("#u2").innerHTML = `9${dot}<span id="u2b" class="res">100</span>`;
        $("#v1").innerHTML = `12${dot}25`;
        $("#v2").innerHTML = `3${dot}${ring("vg", `4${dot}25`)}`;
        $("#v3").innerHTML = `3${dot}<span id="v3b" class="res">100</span>`;
        $("#w2 .pill").innerHTML = `4${dot}25${eq}100`;
        const bird = owl($("#owl-layer"), ["idle", "happy", "cheer"], { left: "34px", top: "390px" });
        const lime = color("concept-lime");
        const clear = "rgba(0,0,0,0)";

        // ---------- scene windows ----------
        scenes([
          ["#s1", "s01-de"],
          ["#s2", "s02-tach"],
          ["#s3", "s03-quy-tac"],
          ["#s4", "s04-tinh"],
          ["#s5", "s05-thu"],
          ["#s6", "s06-nho"],
        ]);
        pop(bird.wrap, 0.3, { from: 0.3 });

        // ---------- s01: 25 trays of 36 ----------
        {
          const sid = "s01-de";
          hide(["#title", "#tg1", "#tg2", "#ask"]);
          pose(bird, "happy", W(sid, "chào"));
          rise("#title", W(sid, "chào"));
          tl.to("#title", { autoAlpha: 0, duration: 0.3 }, W(sid, "bạn", 2) - 0.3);
          pop("#tg1", W(sid, "25"), { from: 0.6 });
          pop("#tg2", W(sid, "36"), { from: 0.6 });
          pop("#ask", W(sid, "36", 2), { from: 0.6 });
        }

        // ---------- s02: split 36, spot 4 · 25 ----------
        {
          const sid = "s02-tach";
          pose(bird, "idle", start(sid));
          hide(["#r2", "#r3", "#r3res"]);
          tl.set("#r1", { autoAlpha: 1 }, start(sid));
          rise("#r2", W(sid, "9"), { y: 20 });
          tl.to("#rg", { borderColor: lime, duration: 0.3 }, W(sid, "4", 2));
          rise("#r3", W(sid, "4", 2), { y: 20 });
          pop("#r3res", W(sid, "100"), { from: 0.5 });
          pose(bird, "happy", W(sid, "100"));
        }

        // ---------- s03: the rule, with small numbers ----------
        {
          const sid = "s03-quy-tac";
          pose(bird, "idle", start(sid));
          hide(["#law", "#law-res", "#law-chip"]);
          pop("#law", W(sid, "ba"), { from: 0.7 });
          tl.to("#la", { borderColor: lime, duration: 0.3 }, W(sid, "nhóm"));
          tl.to("#la", { borderColor: clear, duration: 0.3 }, W(sid, "nào") + 0.2);
          tl.to("#lb", { borderColor: lime, duration: 0.3 }, W(sid, "nào") + 0.2);
          tl.to("#lb", { borderColor: clear, duration: 0.3 }, W(sid, "tích"));
          pop("#law-res", W(sid, "không"), { from: 0.5 });
          rise("#law-chip", W(sid, "kết"), { y: 16 });
        }

        // ---------- s04: group 4 with 25 first ----------
        {
          const sid = "s04-tinh";
          pose(bird, "idle", start(sid));
          hide(["#u2", "#u3", "#u4"]);
          tl.set("#u1", { autoAlpha: 1 }, start(sid));
          tl.to("#ug", { borderColor: lime, duration: 0.3 }, W(sid, "4"));
          rise("#u2", W(sid, "bằng"), { y: 20 });
          tl.to("#ug", { borderColor: clear, duration: 0.3 }, W(sid, "bằng") + 0.5);
          pop("#u3", W(sid, "900"), { from: 0.5 });
          rise("#u4", W(sid, "trứng"), { y: 10 });
          pose(bird, "happy", W(sid, "900"));
        }

        // ---------- s05: a try of the child's own ----------
        {
          const sid = "s05-thu";
          pose(bird, "idle", start(sid));
          hide(["#v1", "#v2", "#v3", "#v4"]);
          rise("#v1", W(sid, "12"), { y: 20 });
          rise("#v2", W(sid, "3"), { y: 20 });
          tl.to("#vg", { borderColor: lime, duration: 0.3 }, W(sid, "4", 2));
          rise("#v3", W(sid, "100"), { y: 20 });
          tl.to("#vg", { borderColor: clear, duration: 0.3 }, W(sid, "100") + 0.5);
          pop("#v4", W(sid, "300"), { from: 0.5 });
          pose(bird, "happy", W(sid, "300"));
        }

        // ---------- s06: remember ----------
        {
          const sid = "s06-nho";
          hide(["#c-group", "#wa", "#c-round", "#wb", "#c-mul", "#w2"]);
          rise("#c-group", W(sid, "nhóm"), { y: 14 });
          rise("#wa", W(sid, "cho"), { y: 14 });
          rise("#c-round", W(sid, "ra"), { y: 14 });
          pop("#w2", W(sid, "tròn"), { from: 0.6 });
          rise("#wb", W(sid, "rồi"), { y: 14 });
          rise("#c-mul", W(sid, "nhân"), { y: 14 });
          pose(bird, "cheer", W(sid, "nhớ"));
        }

        finish();
      })();
    </script>
  </body>
</html>
