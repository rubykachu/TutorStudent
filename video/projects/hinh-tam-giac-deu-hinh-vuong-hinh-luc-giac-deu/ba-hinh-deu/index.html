<!doctype html>
<!--
  Lesson video "Ba hình quanh ta" (lesson hinh-tam-giac-deu-hinh-vuong-hinh-luc-giac-deu):
  the equilateral triangle, the square and the regular hexagon have equal sides and
  equal angles; the square and the hexagon also have equal diagonals.
  Colours as in the lesson: triangle teal, square pink, hexagon lime. The shapes are the
  lesson's own figures (figures.tsx). Built by
  `pnpm video:build hinh-tam-giac-deu-hinh-vuong-hinh-luc-giac-deu ba-hinh-deu`, which
  injects window.TIMING. The rule cards carry `data-rule-text`: their text is the lesson's
  note word for word.
-->
<html lang="vi">
  <head>
    <title>Ba hình quanh ta</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="base.css" />
    <style>
      .name {
        position: absolute;
        top: 470px;
        width: 350px;
        display: flex;
        justify-content: center;
      }
      .name .chip {
        font-size: 30px;
      }
      .rule {
        position: absolute;
        left: 100px;
        width: 1080px;
        top: 40px;
        padding: 20px 32px;
        font:
          600 30px / 1.4 "Be Vietnam Pro",
          sans-serif;
        text-align: center;
        box-sizing: border-box;
        text-wrap: balance;
      }
      .figure-wrap {
        width: 350px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="75"
      data-width="1280"
      data-height="720"
    >
      <div id="stage" class="layer">
        <section id="s1" class="scene layer">
          <div class="row title" style="top: 50px">Ba hình quanh ta</div>
        </section>
        <section id="s2" class="scene layer"></section>
        <section id="s3" class="scene layer">
          <div id="rule3" class="card rule" data-rule-text>
            Hình tam giác đều, hình vuông và hình lục giác đều cùng có các cạnh
            bằng nhau và các góc bằng nhau.
          </div>
        </section>
        <section id="s4" class="scene layer"></section>
        <section id="s6" class="scene layer">
          <div id="rule6" class="card rule" data-rule-text>
            Hình tam giác đều, hình vuông và hình lục giác đều cùng có các cạnh
            bằng nhau và các góc bằng nhau.
          </div>
        </section>
      </div>
      <div id="owl-layer" class="layer"></div>
      <div
        id="fade"
        class="layer"
        style="background: var(--color-background)"
      ></div>
    </div>

    <script src="gsap.min.js"></script>
    <script src="owl.js"></script>
    <script src="figures.js"></script>
    <script>
      /*TIMING:BEGIN*/ window.TIMING = null; /*TIMING:END*/
    </script>
    <script src="runtime.js"></script>
    <script>
      (() => {
        const { $, start, W, owl, figure, pop, hide, pose, scenes, finish, tl, make } =
          window.LV;
        const bird = owl($("#owl-layer"), ["idle", "happy", "cheer"], {
          left: "30px",
          top: "385px",
          width: "150px",
          height: "150px",
        });
        pop(bird.wrap, 0.3, { from: 0.3 });

        scenes(
          [
            ["#s1", "s01-chao"],
            ["#s2", "s02-hoi"],
            ["#s3", "s03-quy-tac"],
            ["#s4", "s04-goc"],
            ["#s6", "s06-nho"],
          ],
          { leave: 0 },
        );

        // The three shapes of a scene: one figure per shape with the variants
        // to switch between (only the first shows), and a name chip under it.
        const SHAPES = [
          { x: 190, tone: "teal", name: "hình tam giác đều", v: ["tri-plain", "tri"], h: 238 },
          { x: 540, tone: "pink", name: "hình vuông", v: ["sq-plain", "sq"], h: 229 },
          { x: 890, tone: "lime", name: "hình lục giác đều", v: ["hex-plain", "hex"], h: 280 },
        ];
        const trio = (section, first = 0) =>
          SHAPES.map((s) => {
            const f = figure($(section), s.v.slice(first), {
              left: `${s.x}px`,
              top: `${320 - s.h / 2}px`,
              height: `${s.h}px`,
            });
            const label = make(
              "div",
              "name",
              $(section),
              `<span class="chip" style="--c: var(--color-concept-${s.tone})">${s.name}</span>`,
            );
            label.style.left = `${s.x}px`;
            return { ...f, label };
          });
        // Shows one variant of a figure from time t.
        const show = (f, name, t) => {
          for (const [key, layer] of Object.entries(f.layers)) {
            tl.set(layer, { opacity: key === name ? 1 : 0 }, t);
          }
        };

        {
          const sid = "s01-chao";
          trio("#s1");
          pose(bird, "happy", W(sid, "chào"));
          pose(bird, "idle", W(sid, "bạn"));
        }
        {
          const sid = "s02-hoi";
          trio("#s2");
          pose(bird, "idle", start(sid));
        }
        {
          const sid = "s03-quy-tac";
          const shapes = trio("#s3");
          hide(["#rule3"]);
          pose(bird, "idle", start(sid));
          pop("#rule3", start(sid) + 0.1, { from: 0.9 });
          shapes.forEach((f, i) => {
            show(f, SHAPES[i].v[1], W(sid, "cạnh"));
          });
        }
        {
          const sid = "s04-goc";
          const shapes = trio("#s4", 1);
          pose(bird, "idle", start(sid));
          // each shape lights up when its sentence names it
          shapes.forEach((f) => {
            tl.set(f.wrap, { opacity: 0.3 }, start(sid));
          });
          [W(sid, "tam"), W(sid, "vuông"), W(sid, "lục")].forEach((t, i) => {
            tl.to(shapes[i].wrap, { opacity: 1, duration: 0.3 }, t);
          });
        }
        {
          const sid = "s06-nho";
          trio("#s6", 1);
          hide(["#rule6"]);
          pose(bird, "idle", start(sid));
          pop("#rule6", W(sid, "hình"), { from: 0.9 });
          pose(bird, "cheer", W(sid, "hình"));
        }

        finish();
      })();
    </script>
  </body>
</html>
