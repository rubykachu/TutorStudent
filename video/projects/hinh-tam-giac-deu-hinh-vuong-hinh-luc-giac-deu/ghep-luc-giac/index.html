<!doctype html>
<!--
  Lesson video "Sáu tam giác đều ghép thành lục giác" (lesson hinh-tam-giac-deu-hinh-vuong-hinh-luc-giac-deu):
  six equilateral triangles joined at one vertex make a regular hexagon, and its main
  diagonal is twice the side. The hexagon frames are the lesson's own figures
  (figures.tsx). Colours as in the lesson: triangle teal, side blue, diagonal amber.
  Built by `pnpm video:build hinh-tam-giac-deu-hinh-vuong-hinh-luc-giac-deu ghep-luc-giac`,
  which injects window.TIMING. The rule cards carry `data-rule-text`: their text is a sentence
  of the lesson's note word for word.
-->
<html lang="vi">
  <head>
    <title>Sáu tam giác đều ghép thành lục giác</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="base.css" />
    <style>
      .side {
        position: absolute;
        left: 880px;
        display: flex;
      }
      .side .chip {
        white-space: normal;
        font-size: 34px;
      }
      .rule {
        position: absolute;
        left: 100px;
        width: 1080px;
        top: 30px;
        padding: 20px 32px;
        font:
          600 30px / 1.4 "Be Vietnam Pro",
          sans-serif;
        text-align: center;
        box-sizing: border-box;
        text-wrap: balance;
      }
      .figure-wrap {
        left: 360px;
        top: 150px;
        width: 480px;
        height: 384px;
      }
      .count {
        position: absolute;
        left: 880px;
        top: 230px;
        font:
          800 120px / 1 "Baloo 2",
          sans-serif;
        color: var(--color-concept-teal);
        width: 200px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="75"
      data-width="1280"
      data-height="720"
    >
      <div id="stage" class="layer">
        <section id="s1" class="scene layer">
          <div class="row title" style="top: 40px">Ghép hình lục giác đều</div>
        </section>
        <section id="s2" class="scene layer"></section>
        <section id="s3" class="scene layer">
          <div id="count" class="count"></div>
        </section>
        <section id="s4" class="scene layer">
          <div id="rule4" class="card rule" data-rule-text>
            Sáu hình tam giác đều bằng nhau ghép chung một đỉnh ở giữa thành một
            hình lục giác đều.
          </div>
        </section>
        <section id="s5" class="scene layer"></section>
        <section id="s6" class="scene layer">
          <div id="rule6" class="card rule" data-rule-text>
            Đường chéo chính của hình lục giác đều dài gấp đôi cạnh.
          </div>
        </section>
        <section id="s7" class="scene layer">
          <div id="n7" class="side" style="top: 230px">
            <span class="chip" style="--c: var(--color-concept-amber)"
              >7 × 2 = 14</span
            >
          </div>
        </section>
      </div>
      <div id="owl-layer" class="layer"></div>
      <div
        id="fade"
        class="layer"
        style="background: var(--color-background)"
      ></div>
    </div>

    <script src="gsap.min.js"></script>
    <script src="owl.js"></script>
    <script src="figures.js"></script>
    <script>
      /*TIMING:BEGIN*/ window.TIMING = null; /*TIMING:END*/
    </script>
    <script src="runtime.js"></script>
    <script>
      (() => {
        const { $, start, W, owl, figure, pop, hide, pose, scenes, finish, tl } =
          window.LV;
        const bird = owl($("#owl-layer"), ["idle", "happy", "cheer"], {
          left: "30px",
          top: "385px",
          width: "150px",
          height: "150px",
        });
        pop(bird.wrap, 0.3, { from: 0.3 });

        scenes(
          [
            ["#s1", "s01-chao"],
            ["#s2", "s02-hoi"],
            ["#s3", "s03-dem"],
            ["#s4", "s04-quy-tac"],
            ["#s5", "s05-hoi"],
            ["#s6", "s06-cheo"],
            ["#s7", "s07-nho"],
          ],
          { leave: 0 },
        );

        // The hexagon frames of the lesson: 1 to 6 triangles, then the main
        // diagonal. A scene shows the frame it is about from its first frame.
        const hexagon = (section, names) => figure($(section), names, {});
        const grow = (f, sid, words) => {
          words.forEach((word, i) => {
            for (const [key, layer] of Object.entries(f.layers)) {
              tl.set(
                layer,
                { opacity: key === `ghep-${i + 1}` ? 1 : 0 },
                W(sid, word),
              );
            }
          });
        };

        {
          const sid = "s01-chao";
          hexagon("#s1", ["ghep-1"]);
          pose(bird, "happy", W(sid, "chào"));
          pose(bird, "idle", W(sid, "bạn"));
        }
        {
          const sid = "s02-hoi";
          hexagon("#s2", ["ghep-1"]);
          pose(bird, "idle", start(sid));
        }
        {
          const sid = "s03-dem";
          const f = hexagon("#s3", ["ghep-1", "ghep-2", "ghep-3", "ghep-4", "ghep-5", "ghep-6"]);
          pose(bird, "idle", start(sid));
          const words = ["một", "hai", "ba", "bốn", "năm", "sáu"];
          grow(f, sid, words);
          // the count beside the hexagon follows the spoken number
          const count = $("#count");
          words.forEach((word, i) => {
            tl.call(() => (count.textContent = String(i + 1)), [], W(sid, word));
          });
          tl.set(count, { autoAlpha: 0 }, start(sid));
          tl.set(count, { autoAlpha: 1 }, W(sid, "một"));
        }
        {
          const sid = "s04-quy-tac";
          hexagon("#s4", ["ghep-6"]);
          hide(["#rule4"]);
          pose(bird, "idle", start(sid));
          pop("#rule4", start(sid) + 0.1, { from: 0.9 });
        }
        {
          const sid = "s05-hoi";
          hexagon("#s5", ["ghep-6"]);
          pose(bird, "idle", start(sid));
        }
        {
          const sid = "s06-cheo";
          hexagon("#s6", ["ghep-7"]);
          hide(["#rule6"]);
          pose(bird, "idle", start(sid));
          pop("#rule6", start(sid) + 0.1, { from: 0.9 });
        }
        {
          const sid = "s07-nho";
          hexagon("#s7", ["ghep-7"]);
          hide(["#n7"]);
          pose(bird, "idle", start(sid));
          pop("#n7", W(sid, "7"), { from: 0.6 });
          pose(bird, "cheer", W(sid, "biết"));
        }

        finish();
      })();
    </script>
  </body>
</html>
