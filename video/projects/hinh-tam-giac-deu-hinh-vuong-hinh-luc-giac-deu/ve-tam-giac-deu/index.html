<!doctype html>
<!--
  Lesson video "Vẽ tam giác đều bằng compa" (lesson hinh-tam-giac-deu-hinh-vuong-hinh-luc-giac-deu):
  draw one side, open the compass to that side, draw two arcs from the ends of the side,
  join the point where the arcs meet to the two ends. The drawing frames are the lesson's own
  figures (figures.tsx). Colours as in the lesson: triangle teal, side blue.
  Built by `pnpm video:build hinh-tam-giac-deu-hinh-vuong-hinh-luc-giac-deu ve-tam-giac-deu`,
  which injects window.TIMING. The rule cards carry `data-rule-text`: their text is a sentence
  of the lesson's note word for word.
-->
<html lang="vi">
  <head>
    <title>Vẽ tam giác đều bằng compa</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="base.css" />
    <style>
      .step {
        position: absolute;
        left: 860px;
        width: 360px;
        display: flex;
      }
      .step .chip {
        white-space: normal;
        font-size: 34px;
      }
      .rule {
        position: absolute;
        left: 100px;
        width: 1080px;
        top: 40px;
        padding: 20px 32px;
        font:
          600 30px / 1.4 "Be Vietnam Pro",
          sans-serif;
        text-align: center;
        box-sizing: border-box;
        text-wrap: balance;
      }
      .figure-wrap {
        width: 433px;
        height: 400px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="75"
      data-width="1280"
      data-height="720"
    >
      <div id="stage" class="layer">
        <section id="s1" class="scene layer">
          <div class="row title" style="top: 50px">
            Vẽ tam giác đều bằng compa
          </div>
        </section>
        <section id="s2" class="scene layer"></section>
        <section id="s3" class="scene layer">
          <div id="t3" class="step" style="top: 220px">
            <span class="chip" style="--c: var(--color-concept-blue)"
              >Vẽ một cạnh dài 5 cm</span
            >
          </div>
        </section>
        <section id="s4" class="scene layer">
          <div id="rule4" class="card rule" data-rule-text style="top: 30px">
            Vẽ một cạnh, rồi mở compa sao cho hai đầu compa cách nhau đúng bằng
            cạnh đó.
          </div>
        </section>
        <section id="s5" class="scene layer">
          <div id="t5" class="step" style="top: 220px">
            <span class="chip" style="--c: var(--color-concept-slate)"
              >Hai cung tròn gặp nhau</span
            >
          </div>
        </section>
        <section id="s6" class="scene layer">
          <div id="rule6" class="card rule" data-rule-text style="top: 30px">
            Đặt kim ở từng đầu cạnh vẽ hai cung tròn, rồi nối chỗ hai cung gặp
            nhau với hai đầu cạnh.
          </div>
        </section>
        <section id="s7" class="scene layer">
          <div id="t7" class="step" style="top: 220px">
            <span class="chip" style="--c: var(--color-concept-teal)"
              >Hình tam giác đều</span
            >
          </div>
        </section>
      </div>
      <div id="owl-layer" class="layer"></div>
      <div
        id="fade"
        class="layer"
        style="background: var(--color-background)"
      ></div>
    </div>

    <script src="gsap.min.js"></script>
    <script src="owl.js"></script>
    <script src="figures.js"></script>
    <script>
      /*TIMING:BEGIN*/ window.TIMING = null; /*TIMING:END*/
    </script>
    <script src="runtime.js"></script>
    <script>
      (() => {
        const { $, start, W, owl, figure, pop, hide, pose, scenes, finish, tl } =
          window.LV;
        const bird = owl($("#owl-layer"), ["idle", "happy", "cheer"], {
          left: "30px",
          top: "385px",
          width: "150px",
          height: "150px",
        });
        pop(bird.wrap, 0.3, { from: 0.3 });

        scenes(
          [
            ["#s1", "s01-chao"],
            ["#s2", "s02-hoi"],
            ["#s3", "s03-canh"],
            ["#s4", "s04-mo"],
            ["#s5", "s05-cung"],
            ["#s6", "s06-noi"],
            ["#s7", "s07-xong"],
          ],
          { leave: 0 },
        );

        // One drawing frame of the lesson, on the left of the step label; the
        // picture of a scene is there from its first frame.
        const frame = (section, name, top = 90) =>
          figure($(section), [name], {
            left: "400px",
            top: `${top}px`,
          });

        {
          const sid = "s01-chao";
          frame("#s1", "ve-1", 148);
          pose(bird, "happy", W(sid, "chào"));
          pose(bird, "idle", W(sid, "bạn"));
        }
        {
          const sid = "s02-hoi";
          frame("#s2", "ve-1", 148);
          pose(bird, "idle", start(sid));
        }
        {
          const sid = "s03-canh";
          frame("#s3", "ve-1", 148);
          hide(["#t3"]);
          pose(bird, "idle", start(sid));
          pop("#t3", W(sid, "vẽ"), { from: 0.6 });
        }
        {
          const sid = "s04-mo";
          frame("#s4", "ve-2", 148);
          hide(["#rule4"]);
          pose(bird, "idle", start(sid));
          pop("#rule4", start(sid) + 0.1, { from: 0.9 });
        }
        {
          const sid = "s05-cung";
          // the first arc alone, then both, then the point where they meet
          const arcs = figure($("#s5"), ["ve-first-arc", "ve-3", "ve-4"], {
            left: "400px",
            top: "148px",
          });
          hide(["#t5"]);
          pose(bird, "idle", start(sid));
          const only = (name, t) => {
            for (const [key, layer] of Object.entries(arcs.layers)) {
              tl.set(layer, { opacity: key === name ? 1 : 0 }, t);
            }
          };
          only("ve-3", W(sid, "kia"));
          only("ve-4", W(sid, "gặp"));
          pop("#t5", W(sid, "gặp"), { from: 0.6 });
        }
        {
          const sid = "s06-noi";
          frame("#s6", "ve-5", 148);
          hide(["#rule6"]);
          pose(bird, "idle", start(sid));
          pop("#rule6", start(sid) + 0.1, { from: 0.9 });
        }
        {
          const sid = "s07-xong";
          frame("#s7", "ve-5", 148);
          hide(["#t7"]);
          pose(bird, "idle", start(sid));
          pop("#t7", W(sid, "tam"), { from: 0.6 });
          pose(bird, "cheer", W(sid, "ba"));
        }

        finish();
      })();
    </script>
  </body>
</html>
