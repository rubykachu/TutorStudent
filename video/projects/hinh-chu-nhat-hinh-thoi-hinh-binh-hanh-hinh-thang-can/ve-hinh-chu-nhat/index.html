<!doctype html>
<!--
  Lesson video "Vẽ hình chữ nhật" (lesson hinh-chu-nhat-hinh-thoi-hinh-binh-hanh-hinh-thang-can): draw a side with the ruler, two perpendiculars with the set square, two equal segments, then join them.
  Colours as in the lesson: rectangle teal, side blue, right angle violet. The shapes are the lesson's own figures
  (figures.tsx). Built by `pnpm video:build hinh-chu-nhat-hinh-thoi-hinh-binh-hanh-hinh-thang-can ve-hinh-chu-nhat`, which injects window.TIMING.
  The rule cards carry `data-rule-text`: their text is the lesson's note word for word.
-->
<html lang="vi">
  <head>
    <title>Vẽ hình chữ nhật</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="base.css" />
    <style>
      .step {
        position: absolute;
        left: 930px;
        top: 220px;
        width: 300px;
        display: flex;
      }
      .step .chip {
        white-space: normal;
        font-size: 34px;
      }
      .rule {
        position: absolute;
        left: 100px;
        width: 1080px;
        top: 30px;
        padding: 20px 32px;
        font:
          600 30px / 1.4 "Be Vietnam Pro",
          sans-serif;
        text-align: center;
        box-sizing: border-box;
        text-wrap: balance;
      }
      .figure-wrap {
        width: 560px;
        height: 400px;
      }
      .eke {
        position: absolute;
        left: 340px;
        top: 150px;
        width: 480px;
        height: 384px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="75"
      data-width="1280"
      data-height="720"
    >
      <div id="stage" class="layer">
        <section id="s1" class="scene layer">
          <div class="row title" style="top: 50px">Vẽ hình chữ nhật</div>
        </section>
        <section id="s2" class="scene layer"></section>
        <section id="s3" class="scene layer">
          <svg
            id="eke"
            class="eke"
            viewBox="0 0 200 160"
            aria-hidden="true"
          >
            <polygon
              points="20,140 180,140 20,20"
              fill="var(--color-concept-violet)"
              fill-opacity="0.25"
              stroke="var(--color-concept-violet)"
              stroke-width="6"
              stroke-linejoin="round"
            />
            <polyline
              points="20,108 52,108 52,140"
              fill="none"
              stroke="var(--color-concept-violet)"
              stroke-width="5"
            />
          </svg>
        
          <div id="t3" class="step" style="top: 220px">
            <span class="chip" style="--c: var(--color-concept-violet)"
              >Êke: một góc vuông</span
            >
          </div>
        </section>
        <section id="s4" class="scene layer">
          <div id="t4" class="step" style="top: 220px">
            <span class="chip" style="--c: var(--color-concept-blue)"
              >Thước: cạnh dài 4 cm</span
            >
          </div>
        </section>
        <section id="s5" class="scene layer">
          <div id="t5" class="step" style="top: 220px">
            <span class="chip" style="--c: var(--color-concept-violet)"
              >Êke: hai đường vuông góc</span
            >
          </div>
        </section>
        <section id="s6" class="scene layer">
          <div id="t6" class="step" style="top: 220px">
            <span class="chip" style="--c: var(--color-concept-blue)"
              >Hai đoạn dài 3 cm</span
            >
          </div>
        </section>
        <section id="s7" class="scene layer">
          <div id="t7" class="step" style="top: 220px">
            <span class="chip" style="--c: var(--color-concept-teal)"
              >Nối hai đầu đoạn</span
            >
          </div>
        </section>
        <section id="s8" class="scene layer">
          <div id="rule8" class="card rule" data-rule-text>
            Vẽ một cạnh, kẻ hai đường vuông góc ở hai đầu cạnh. Về cùng một phía của cạnh đã vẽ, lấy hai đoạn bằng cạnh kia rồi nối.
          </div>
        </section>
        <section id="s9" class="scene layer">
          <div id="t9" class="step" style="top: 220px">
            <span class="chip" style="--c: var(--color-concept-teal)"
              >Hình chữ nhật</span
            >
          </div>
        </section>
      </div>
      <div id="owl-layer" class="layer"></div>
      <div
        id="fade"
        class="layer"
        style="background: var(--color-background)"
      ></div>
    </div>

    <script src="gsap.min.js"></script>
    <script src="owl.js"></script>
    <script src="figures.js"></script>
    <script>
      /*TIMING:BEGIN*/ window.TIMING = null; /*TIMING:END*/
    </script>
    <script src="runtime.js"></script>
    <script>
      (() => {
        const { $, start, W, owl, figure, pop, hide, pose, scenes, finish } =
          window.LV;
        const bird = owl($("#owl-layer"), ["idle", "happy", "cheer"], {
          left: "30px",
          top: "385px",
          width: "150px",
          height: "150px",
        });
        pop(bird.wrap, 0.3, { from: 0.3 });

        scenes(
          [
            ["#s1", "s01-chao"],
            ["#s2", "s02-hoi"],
            ["#s3", "s03-eke"],
            ["#s4", "s04-canh"],
            ["#s5", "s05-vuong"],
            ["#s6", "s06-lay"],
            ["#s7", "s07-noi"],
            ["#s8", "s08-quy-tac"],
            ["#s9", "s09-xong"],
          ],
          { leave: 0 },
        );

        // A picture of the lesson on the stage, with the variants to switch
        // between (only the first shows); the picture of a scene is there from
        // its first frame. `box` moves or resizes it.
        const picture = (section, names, box = {}) =>
          figure($(section), names, {
            left: "300px",
            top: "148px",
            ...box,
          });

        // The drawing steps use the whole height above the caption band.
        const BIG = { left: "250px", top: "40px", width: "640px", height: "500px" };
        const UNDER_TITLE = { ...BIG, top: "110px", height: "430px" };
        const UNDER_RULE = { ...BIG, top: "150px", height: "390px" };
        {
          const sid = "s01-chao";
          picture("#s1", ["ve-4"], UNDER_TITLE);
          pose(bird, "happy", W(sid, "chào"));
          pose(bird, "idle", W(sid, "bạn"));
        }
        {
          const sid = "s02-hoi";
          picture("#s2", ["ve-4"], BIG);
          pose(bird, "idle", start(sid));
        }
        {
          const sid = "s03-eke";
          hide(["#t3", "#eke"]);
          pose(bird, "idle", start(sid));
          pop("#eke", start(sid) + 0.1, { from: 0.6 });
          pop("#t3", W(sid, "êke"), { from: 0.6 });
        }
        {
          const sid = "s04-canh";
          picture("#s4", ["ve-1"], BIG);
          hide(["#t4"]);
          pose(bird, "idle", start(sid));
          pop("#t4", W(sid, "thước"), { from: 0.6 });
        }
        {
          const sid = "s05-vuong";
          picture("#s5", ["ve-2"], BIG);
          hide(["#t5"]);
          pose(bird, "idle", start(sid));
          pop("#t5", W(sid, "êke"), { from: 0.6 });
        }
        {
          const sid = "s06-lay";
          picture("#s6", ["ve-3"], BIG);
          hide(["#t6"]);
          pose(bird, "idle", start(sid));
          pop("#t6", W(sid, "lấy"), { from: 0.6 });
        }
        {
          const sid = "s07-noi";
          picture("#s7", ["ve-4"], BIG);
          hide(["#t7"]);
          pose(bird, "idle", start(sid));
          pop("#t7", W(sid, "nối"), { from: 0.6 });
        }
        {
          const sid = "s08-quy-tac";
          picture("#s8", ["ve-4"], UNDER_RULE);
          hide(["#rule8"]);
          pose(bird, "idle", start(sid));
          pop("#rule8", start(sid) + 0.1, { from: 0.9 });
        }
        {
          const sid = "s09-xong";
          picture("#s9", ["ve-4"], BIG);
          hide(["#t9"]);
          pose(bird, "cheer", W(sid, "vậy"));
          pop("#t9", W(sid, "hình"), { from: 0.6 });
        }

        finish();
      })();
    </script>
  </body>
</html>
