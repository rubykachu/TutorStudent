<!doctype html>
<!--
  Lesson video "Tìm BCNN bằng thừa số nguyên tố" (lesson
  boi-chung-boi-chung-nho-nhat): 12 = 2² · 3 and 18 = 2 · 3² in aligned
  columns; primes are sky, exponents violet, the largest exponent of each
  column is ringed, the product is pink (BCNN).
  Built by `pnpm video:build boi-chung-boi-chung-nho-nhat phan-tich`, which
  injects window.TIMING.
-->
<html lang="vi">
  <head>
    <title>Tìm BCNN bằng thừa số nguyên tố</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="base.css" />
    <style>
      .sky {
        --c: var(--color-concept-sky);
      }
      .pink {
        --c: var(--color-concept-pink);
      }
      .chip {
        font-size: 36px;
      }
      .ps {
        color: var(--color-concept-sky);
      }
      .ex {
        color: var(--color-concept-violet);
        font-size: 0.6em;
        vertical-align: 0.8em;
        margin-left: 0.04em;
      }
      .tbl {
        position: absolute;
        left: 270px;
        top: 40px;
      }
      .rw {
        position: absolute;
        height: 100px;
        display: flex;
        align-items: center;
        font:
          800 78px / 1 "Baloo 2",
          sans-serif;
        white-space: nowrap;
      }
      .cl {
        position: absolute;
        width: 150px;
        height: 100px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 24px;
        font:
          800 78px / 1 "Baloo 2",
          sans-serif;
      }
      .nm {
        position: absolute;
        width: 150px;
        text-align: right;
        font:
          800 70px / 1 "Baloo 2",
          sans-serif;
        height: 100px;
        display: flex;
        align-items: center;
        justify-content: flex-end;
      }
      .eq {
        position: absolute;
        font:
          800 70px / 1 "Baloo 2",
          sans-serif;
        height: 100px;
        display: flex;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="90"
      data-width="1280"
      data-height="720"
    >
      <div id="stage" class="layer">
        <section id="s1" class="scene layer">
          <div id="a1" class="row" style="top: 90px; gap: 80px"></div>
          <div id="a2" class="row" style="top: 270px"></div>
        </section>
        <section id="s2" class="scene layer">
          <div id="z2" class="layer"></div>
        </section>
        <section id="s3" class="scene layer">
          <div id="z3" class="layer"></div>
        </section>
        <section id="s4" class="scene layer">
          <div id="z4" class="layer"></div>
        </section>
      </div>
      <div id="owl-layer" class="layer"></div>
      <div
        id="fade"
        class="layer"
        style="background: var(--color-background)"
      ></div>
    </div>

    <script src="gsap.min.js"></script>
    <script src="owl.js"></script>
    <script src="figures.js"></script>
    <script>
      /*TIMING:BEGIN*/ window.TIMING = null; /*TIMING:END*/
    </script>
    <script src="runtime.js"></script>
    <script>
      (() => {
        const { $, start, W, owl, pop, hide, pose, scenes, finish } = window.LV;
        const chip = (id, c, html) =>
          `<span id="${id}" class="chip ${c}" style="--c: var(--color-concept-${c})">${html}</span>`;
        const el = (host, html) => host.insertAdjacentHTML("beforeend", html);
        const f = (base, exp) =>
          `<span class="ps">${base}</span>${exp ? `<span class="ex">${exp}</span>` : ""}`;

        // ---------- s01: two numbers, prime factors ----------
        $("#a1").innerHTML =
          `<span id="n12" class="math pill" style="font-size: 96px">12</span><span id="n18" class="math pill" style="font-size: 96px">18</span>`;
        $("#a2").innerHTML = chip("q1", "sky", "✚ thừa số nguyên tố");

        // The table: a row per number, a column per prime factor (2 and 3).
        const X = { name: 230, c2: 450, dot: 610, c3: 650 };
        const row = (host, id, top, name, cells) => {
          el(
            host,
            `<div id="${id}-n" class="nm" style="left: ${X.name}px; top: ${top}px">${name} =</div>`,
          );
          cells.forEach(([key, base, exp]) => {
            const x = key === "c2" ? X.c2 : X.c3;
            el(
              host,
              `<div id="${id}-${key}" class="cl" style="left: ${x}px; top: ${top}px"><span>${f(base, exp)}</span></div>`,
            );
          });
          el(
            host,
            `<div id="${id}-d" class="eq" style="left: ${X.dot + 12}px; top: ${top}px">·</div>`,
          );
        };
        // ---------- s02: factorising ----------
        row($("#z2"), "r12", 60, 12, [
          ["c2", 2, 2],
          ["c3", 3, ""],
        ]);
        row($("#z2"), "r18", 190, 18, [
          ["c2", 2, ""],
          ["c3", 3, 2],
        ]);
        // ---------- s03: the same table, picking the largest exponents ----------
        row($("#z3"), "p12", 60, 12, [
          ["c2", 2, 2],
          ["c3", 3, ""],
        ]);
        row($("#z3"), "p18", 190, 18, [
          ["c2", 2, ""],
          ["c3", 3, 2],
        ]);
        el(
          $("#z3"),
          `<div id="pk" class="abs" style="left: 330px; top: 340px">${chip("pkc", "pink", "▲ số mũ lớn nhất của từng cột")}</div>`,
        );
        // ---------- s04: multiply ----------
        el(
          $("#z4"),
          `<div id="ln" class="row" style="top: 90px"><span id="mp" class="math pill" style="font-size: 76px">${f(2, 2)}<span class="op">·</span>${f(3, 2)} = 4 <span class="op">·</span> 9</span></div>`,
        );
        el(
          $("#z4"),
          `<div id="bcnn" class="row" style="top: 270px"><span id="bp" class="math pill" style="font-size: 76px; background: color-mix(in srgb, var(--color-concept-pink) 25%, var(--color-surface))">BCNN(12, 18) = <span style="color: var(--color-concept-pink)">36</span></span></div>`,
        );
        const bird = owl($("#owl-layer"), ["idle", "happy", "cheer"], {
          left: "34px",
          top: "366px",
        });

        scenes([
          ["#s1", "s01-mo"],
          ["#s2", "s02-phan-tich"],
          ["#s3", "s03-chon"],
          ["#s4", "s04-nhan"],
        ]);
        pop(bird.wrap, 0.3, { from: 0.3 });

        {
          const sid = "s01-mo";
          hide(["#n12", "#n18", "#q1"]);
          pose(bird, "happy", W(sid, "chào"));
          pop(["#n12", "#n18"], start(sid) + 0.2, { from: 0.5, stagger: 0.2 });
          pose(bird, "idle", W(sid, "viết"));
          pop("#q1", W(sid, "thừa"), { from: 0.6 });
        }
        {
          const sid = "s02-phan-tich";
          hide([
            "#r12-n",
            "#r12-c2",
            "#r12-c3",
            "#r12-d",
            "#r18-n",
            "#r18-c2",
            "#r18-c3",
            "#r18-d",
          ]);
          pose(bird, "idle", start(sid));
          pop(["#r12-n"], W(sid, "12"), { from: 0.5 });
          pop(["#r12-c2", "#r12-d"], W(sid, "2"), { from: 0.5 });
          pop("#r12-c3", W(sid, "nhân"), { from: 0.5 });
          pop(["#r18-n"], W(sid, "18"), { from: 0.5 });
          pop(["#r18-c2", "#r18-d"], W(sid, "2", 3), { from: 0.5 });
          pop("#r18-c3", W(sid, "nhân", 2), { from: 0.5 });
        }
        {
          const sid = "s03-chon";
          hide(["#pkc"]);
          pose(bird, "idle", start(sid));
          pop("#pkc", W(sid, "lớn"), { from: 0.6 });
          ringCell("#p12-c2", W(sid, "2", 3));
          ringCell("#p18-c3", W(sid, "2", 4));
          pose(bird, "happy", W(sid, "2", 3));
        }
        {
          const sid = "s04-nhan";
          hide(["#mp", "#bp"]);
          pose(bird, "idle", start(sid));
          pop("#mp", W(sid, "2"), { from: 0.6 });
          pop("#bp", W(sid, "vậy"), { from: 0.6 });
          pose(bird, "cheer", W(sid, "vậy"));
        }

        function ringCell(sel, t) {
          const violet = window.LV.color("concept-violet");
          window.LV.tl.fromTo(
            sel,
            { boxShadow: `0 0 0 0px ${violet}` },
            {
              boxShadow: `0 0 0 7px ${violet}`,
              duration: 0.4,
              immediateRender: false,
            },
            t,
          );
        }

        finish();
      })();
    </script>
  </body>
</html>
