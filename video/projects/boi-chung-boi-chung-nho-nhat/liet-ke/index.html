<!doctype html>
<!--
  Lesson video "Tìm BCNN bằng cách liệt kê" (lesson boi-chung-boi-chung-nho-nhat):
  multiples of 9 (blue circles) and of 12 (teal squares) on one axis, so 36
  lines up in both rows and turns pink (BCNN); then only the multiples of the
  larger number are tested for divisibility by 9.
  Built by `pnpm video:build boi-chung-boi-chung-nho-nhat liet-ke`, which
  injects window.TIMING.
-->
<html lang="vi">
  <head>
    <title>Tìm BCNN bằng cách liệt kê</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="base.css" />
    <style>
      .blue {
        --c: var(--color-concept-blue);
      }
      .teal {
        --c: var(--color-concept-teal);
      }
      .pink {
        --c: var(--color-concept-pink);
      }
      .slate {
        --c: var(--color-concept-slate);
      }
      .chip {
        font-size: 38px;
      }
      .mk {
        position: absolute;
        width: 74px;
        height: 74px;
        margin: -37px 0 0 -37px;
        display: flex;
        align-items: center;
        justify-content: center;
        font:
          800 42px / 1 "Baloo 2",
          sans-serif;
        color: var(--color-surface);
        background: var(--c);
      }
      .mk.a {
        border-radius: 50%;
      }
      .mk.b {
        border-radius: 16px;
      }
      .band {
        position: absolute;
        width: 110px;
        height: 250px;
        margin-left: -55px;
        border-radius: 30px;
        background: color-mix(
          in srgb,
          var(--color-concept-pink) 30%,
          transparent
        );
        border: 5px solid var(--color-concept-pink);
      }
      .lbl {
        position: absolute;
        width: 150px;
        text-align: right;
        font:
          800 40px / 1 "Be Vietnam Pro",
          sans-serif;
      }
      .axis {
        position: absolute;
        left: 330px;
        width: 880px;
        height: 6px;
        border-radius: 3px;
        background: var(--color-muted-foreground);
      }
      .tg {
        position: absolute;
        font:
          800 36px / 1 "Be Vietnam Pro",
          sans-serif;
        color: var(--c);
        white-space: nowrap;
      }
      .tst {
        position: absolute;
        width: 240px;
        text-align: center;
        font:
          800 44px / 1.1 "Baloo 2",
          sans-serif;
      }
      .tst small {
        display: block;
        font:
          800 36px / 1.2 "Be Vietnam Pro",
          sans-serif;
      }
      .no {
        color: var(--color-muted-foreground);
      }
      .yes {
        color: var(--color-concept-pink);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="90"
      data-width="1280"
      data-height="720"
    >
      <div id="stage" class="layer">
        <section id="s1" class="scene layer">
          <div id="a1" class="row" style="top: 90px; gap: 60px"></div>
          <div id="a2" class="row" style="top: 270px"></div>
        </section>
        <section id="s2" class="scene layer">
          <div id="z2" class="layer"></div>
        </section>
        <section id="s3" class="scene layer">
          <div id="r1" class="row" style="top: 90px"></div>
          <div id="r2" class="row" style="top: 220px"></div>
        </section>
        <section id="s4" class="scene layer">
          <div id="z4" class="layer"></div>
        </section>
      </div>
      <div id="owl-layer" class="layer"></div>
      <div
        id="fade"
        class="layer"
        style="background: var(--color-background)"
      ></div>
    </div>

    <script src="gsap.min.js"></script>
    <script src="owl.js"></script>
    <script src="figures.js"></script>
    <script>
      /*TIMING:BEGIN*/ window.TIMING = null; /*TIMING:END*/
    </script>
    <script src="runtime.js"></script>
    <script>
      (() => {
        const { $, start, W, owl, pop, hide, pose, scenes, finish } = window.LV;
        const chip = (id, c, html) =>
          `<span id="${id}" class="chip ${c}">${html}</span>`;
        const el = (host, html) => host.insertAdjacentHTML("beforeend", html);

        // ---------- s01: the two numbers ----------
        $("#a1").innerHTML =
          `<span id="n9" class="mk a blue" style="position: static; margin: 0; width: 130px; height: 130px; font-size: 76px">9</span><span id="n12" class="mk b teal" style="position: static; margin: 0; width: 130px; height: 130px; font-size: 76px">12</span>`;
        $("#a2").innerHTML = chip("q1", "pink", "tìm bội chung nhỏ nhất");

        // ---------- s02: both lists on one axis (0 to 36) ----------
        const X = (m) => 330 + (m * 880) / 36;
        const rowA = [9, 18, 27, 36];
        const rowB = [12, 24, 36];
        const z2 = $("#z2");
        el(
          z2,
          `<div class="lbl blue" style="left: 150px; top: 124px">bội của 9</div><div class="lbl teal" style="left: 150px; top: 274px">bội của 12</div>`,
        );
        el(z2, `<div class="axis" style="top: 217px"></div>`);
        el(
          z2,
          `<div id="bd36" class="band" style="left: ${X(36) - 20}px; top: 100px"></div>`,
        );
        rowA.forEach((m) =>
          el(
            z2,
            `<div id="ma${m}" class="mk a blue" style="left: ${m === 36 ? X(36) - 20 : X(m)}px; top: 150px">${m}</div>`,
          ),
        );
        rowB.forEach((m) =>
          el(
            z2,
            `<div id="mb${m}" class="mk b teal" style="left: ${m === 36 ? X(36) - 20 : X(m)}px; top: 300px">${m}</div>`,
          ),
        );
        el(
          z2,
          `<div id="tg36" class="tg pink" style="left: ${X(36) - 320}px; top: 385px">✓ có ở cả hai hàng</div>`,
        );

        // ---------- s03: the method, in short labels ----------
        $("#r1").innerHTML = chip("m1", "slate", "1 ▸ viết bội của từng số");
        $("#r2").innerHTML = chip(
          "m2",
          "pink",
          "2 ▸ chọn số nhỏ nhất có ở mọi hàng",
        );

        // ---------- s04: only the multiples of 12, tested against 9 ----------
        const z4 = $("#z4");
        const tests = [
          [12, "no", "✕", 0],
          [24, "no", "✕", 1],
          [36, "yes", "✓", 2],
        ];
        el(
          z4,
          `<div id="h12" class="abs" style="left: 330px; top: 30px">${chip("h12c", "teal", "■ bội của 12")}</div>`,
        );
        tests.forEach(([m, k, s, i]) => {
          const x = 440 + i * 260;
          el(
            z4,
            `<div id="k${m}" class="mk b ${k === "yes" ? "pink" : "teal"}" style="left: ${x}px; top: 190px">${m}</div>`,
          );
          el(
            z4,
            `<div id="t${m}" class="tst ${k}" style="left: ${x - 120}px; top: 250px">${s}<small>${m} chia hết cho 9?</small></div>`,
          );
        });
        el(
          z4,
          `<div id="fin" class="abs" style="left: 330px; top: 410px"><span class="math pill small" style="background: color-mix(in srgb, var(--color-concept-pink) 25%, var(--color-surface))">BCNN(9, 12) = <span style="color: var(--color-concept-pink)">36</span></span></div>`,
        );
        const bird = owl($("#owl-layer"), ["idle", "happy", "cheer"], {
          left: "34px",
          top: "366px",
        });

        scenes([
          ["#s1", "s01-mo"],
          ["#s2", "s02-ds"],
          ["#s3", "s03-quy-tac"],
          ["#s4", "s04-nhanh"],
        ]);
        pop(bird.wrap, 0.3, { from: 0.3 });

        {
          const sid = "s01-mo";
          hide(["#n9", "#n12", "#q1"]);
          pose(bird, "happy", W(sid, "chào"));
          pop("#q1", start(sid) + 0.2, { from: 0.6 });
          pose(bird, "idle", W(sid, "ta", 2));
          pop("#n9", W(sid, "9"), { from: 0.5 });
          pop("#n12", W(sid, "12"), { from: 0.5 });
        }
        {
          const sid = "s02-ds";
          hide([
            ...rowA.map((m) => `#ma${m}`),
            ...rowB.map((m) => `#mb${m}`),
            "#bd36",
            "#tg36",
          ]);
          pose(bird, "idle", start(sid));
          pop("#ma9", W(sid, "9"), { from: 0.5 });
          pop("#ma18", W(sid, "18"), { from: 0.5 });
          pop("#ma27", W(sid, "27"), { from: 0.5 });
          pop("#ma36", W(sid, "36"), { from: 0.5 });
          pop("#mb12", W(sid, "12"), { from: 0.5 });
          pop("#mb24", W(sid, "24"), { from: 0.5 });
          pop("#mb36", W(sid, "36", 2), { from: 0.5 });
          pop("#bd36", W(sid, "số", 2), { from: 0.5 });
          pop("#tg36", W(sid, "hai", 2), { from: 0.5 });
          pose(bird, "happy", W(sid, "số", 2));
        }
        {
          const sid = "s03-quy-tac";
          hide(["#m1", "#m2"]);
          pose(bird, "idle", start(sid));
          pop("#m1", start(sid) + 0.2, { from: 0.6 });
          pop("#m2", W(sid, "chọn"), { from: 0.6 });
        }
        {
          const sid = "s04-nhanh";
          hide([
            "#h12c",
            "#k12",
            "#k24",
            "#k36",
            "#t12",
            "#t24",
            "#t36",
            "#fin",
          ]);
          pose(bird, "idle", start(sid));
          pop("#h12c", start(sid) + 0.2, { from: 0.6 });
          pop("#k12", W(sid, "12"), { from: 0.5 });
          pop("#t12", W(sid, "không"), { from: 0.5 });
          pop("#k24", W(sid, "24"), { from: 0.5 });
          pop("#t24", W(sid, "không", 3), { from: 0.5 });
          pop("#k36", W(sid, "36"), { from: 0.5 });
          pop("#t36", W(sid, "chia", 4), { from: 0.5 });
          pop("#fin", W(sid, "vậy"), { from: 0.6 });
          pose(bird, "cheer", W(sid, "vậy"));
        }

        finish();
      })();
    </script>
  </body>
</html>
