<!DOCTYPE html>
<!--
  Lesson video "Kí hiệu thuộc và không thuộc" (lesson tap-hop): with the set
  A = {1; 2; 3}, 2 is inside so "2 ∈ A", 5 is outside so "5 ∉ A"; both marks
  are written stroke by stroke (∉ is ∈ plus a slash).
  Built by `pnpm video:build tap-hop thuoc-khong-thuoc`, which injects
  window.TIMING (scene windows and spoken word times from script.json).
-->
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <title>Kí hiệu thuộc và không thuộc</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="base.css" />
    <style>
      .setbox { position: absolute; left: 250px; top: 50px; width: 560px; height: 150px; border: 7px solid var(--color-concept-teal); border-radius: 36px; background: var(--color-surface); display: flex; align-items: center; justify-content: center; gap: 22px; }
      .setbox .name { font: 800 64px / 1 "Baloo 2", sans-serif; color: var(--color-concept-teal); margin-right: 10px; }
      .chipn { width: 84px; height: 84px; border: 5px solid var(--color-concept-amber); border-radius: 20px; background: var(--color-surface); font: 800 56px / 74px "Baloo 2", sans-serif; text-align: center; color: var(--color-foreground); }
      .outside { position: absolute; left: 910px; top: 66px; }
      .glyph { height: 190px; width: auto; display: block; }
      .glyph .badge { opacity: 0; }
      .el { color: var(--color-concept-amber); }
      .nm { color: var(--color-concept-teal); }
      .stmt { align-items: center; gap: 14px; font-size: 100px; }
      .word { font: 800 64px / 1 "Baloo 2", sans-serif; color: var(--color-concept-slate); }
      .small .glyph { height: 120px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="60" data-width="1280" data-height="720">
      <div id="stage" class="layer">
        <section id="top" class="scene layer">
          <div id="box" class="setbox">
            <span class="name">A</span>
            <span id="n1" class="chipn">1</span>
            <span id="n2" class="chipn">2</span>
            <span id="n3" class="chipn">3</span>
          </div>
          <span id="n5" class="chipn outside">5</span>
          <div id="row-t" class="row math stmt" style="top: 250px">
            <span class="el">2</span>
            <span id="word-t" class="word">thuộc</span>
            <span id="g-t"></span>
            <span class="nm">A</span>
          </div>
          <div id="row-k" class="row math stmt" style="top: 250px">
            <span class="el">5</span>
            <span id="word-k" class="word">không thuộc</span>
            <span id="g-k"></span>
            <span class="nm">A</span>
          </div>
          <div id="read-t" class="row" style="top: 470px"><span class="chip" style="--c: var(--color-concept-amber)">đọc: 2 thuộc A</span></div>
          <div id="read-k" class="row" style="top: 470px"><span class="chip" style="--c: var(--color-concept-slate)">đọc: 5 không thuộc A</span></div>
        </section>
        <section id="s6" class="scene layer">
          <div id="sum-t" class="row math stmt small" style="top: 110px"><span class="el">2</span><span id="s-g-t"></span><span class="nm">A</span><span class="word">thuộc</span></div>
          <div id="sum-k" class="row math stmt small" style="top: 300px"><span class="el">5</span><span id="s-g-k"></span><span class="nm">A</span><span class="word">không thuộc</span></div>
        </section>
      </div>
      <div id="owl-layer" class="layer"></div>
      <div id="fade" class="layer" style="background: var(--color-background)"></div>
    </div>

    <script src="gsap.min.js"></script>
    <script src="owl.js"></script>
    <script src="figures.js"></script>
    <script>/*TIMING:BEGIN*/window.TIMING=null;/*TIMING:END*/</script>
    <script src="runtime.js"></script>
    <script>
      (() => {
        const { tl, $, $$, start, end, W, owl, pop, rise, hide, tint, pose, scenes, finish } = window.LV;

        // ---------- DOM ----------
        $("#g-t").innerHTML = window.FIGURES["glyph-thuoc"];
        $("#g-k").innerHTML = window.FIGURES["glyph-khong-thuoc"];
        $("#s-g-t").innerHTML = window.FIGURES["glyph-thuoc"];
        $("#s-g-k").innerHTML = window.FIGURES["glyph-khong-thuoc"];
        const bird = owl($("#owl-layer"), ["idle", "happy", "cheer"], { left: "34px", top: "390px" });

        // A stroke of a mark is inked like a pen: its numbered start dot shows,
        // the stroke draws, the dot goes.
        const strokes = new Map();
        const prepare = (svg, inked) => {
          const paths = $$(".stroke", svg);
          if (!inked) {
            paths.forEach((p) => {
              const len = p.getTotalLength();
              p.style.strokeDasharray = `${len} ${len}`;
              p.style.strokeDashoffset = `${len}`;
              p.style.opacity = "0";
            });
          }
          strokes.set(svg, paths);
        };
        const ink = (svg, i, t, d = 0.9) => {
          const path = strokes.get(svg)[i];
          const badge = $$(".badge", svg)[i];
          const len = path.getTotalLength();
          tl.to(badge, { opacity: 1, duration: 0.2 }, t);
          tl.set(path, { opacity: 1 }, t + 0.2);
          tl.fromTo(path, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: d, ease: "power1.inOut", immediateRender: false }, t + 0.2);
          tl.to(badge, { opacity: 0, duration: 0.2 }, t + 0.2 + d);
        };
        const svgT = $("#g-t svg");
        const svgK = $("#g-k svg");
        prepare(svgT, false);
        prepare(svgK, false);
        // The recap marks are plain: no start dots.
        $$("#s6 .badge").forEach((b) => { b.style.display = "none"; });

        // ---------- layers ----------
        {
          const el = $("#top");
          tl.fromTo(el, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.35, immediateRender: false }, 0);
          tl.to(el, { autoAlpha: 0, duration: 0.3 }, end("s05-ve-khong") - 0.3);
        }
        scenes([["#s6", "s06-nho"]]);
        pop(bird.wrap, 0.3, { from: 0.3 });

        // ---------- s01: the set A ----------
        {
          const sid = "s01-tap-a";
          hide(["#box", "#n1", "#n2", "#n3", "#n5", "#row-t", "#row-k", "#read-t", "#read-k"]);
          pose(bird, "happy", W(sid, "cú"));
          pop("#box", start(sid) + 0.2, { from: 0.7 });
          // The numbers are in the box from the start; "box" only fades in with them.
          hide(["#n1", "#n2", "#n3"]);
          pop("#n1", W(sid, "đó"), { from: 0.4 });
          pop("#n2", W(sid, "đó") + 0.6, { from: 0.4 });
          pop("#n3", W(sid, "đó") + 1.2, { from: 0.4 });
        }

        // ---------- s02: 2 is inside, so it belongs ----------
        {
          const sid = "s02-thuoc";
          pose(bird, "idle", start(sid));
          tint("#n2", W(sid, "nằm"));
          rise("#row-t", W(sid, "thuộc", 1));
        }

        // ---------- s03: write the mark of "thuộc" ----------
        {
          const sid = "s03-ve-thuoc";
          tl.set("#word-t", { display: "none" }, start(sid) + 0.4);
          ink(svgT, 0, W(sid, "một"));
          ink(svgT, 1, W(sid, "hai"));
          rise("#read-t", W(sid, "đọc"));
        }

        // ---------- s04: 5 is outside ----------
        {
          const sid = "s04-khong";
          pose(bird, "idle", start(sid));
          tl.set("#row-t", { autoAlpha: 0 }, start(sid));
          tl.set("#read-t", { autoAlpha: 0 }, start(sid));
          tl.to("#n2", { backgroundColor: "rgba(0,0,0,0)", duration: 0.2 }, start(sid));
          pop("#n5", W(sid, "số", 1), { from: 0.4 });
          rise("#row-k", W(sid, "không", 1));
        }

        // ---------- s05: the mark of "không thuộc" ----------
        {
          const sid = "s05-ve-khong";
          tl.set("#word-k", { display: "none" }, start(sid) + 0.4);
          ink(svgK, 0, W(sid, "thuộc", 1), 0.7);
          ink(svgK, 1, W(sid, "thuộc", 1) + 1.0, 0.5);
          ink(svgK, 2, W(sid, "thêm"), 0.7);
          rise("#read-k", W(sid, "đọc"));
        }

        // ---------- s06: remember ----------
        {
          const sid = "s06-nho";
          hide(["#sum-t", "#sum-k"]);
          pose(bird, "cheer", W(sid, "nhớ"));
          rise("#sum-t", W(sid, "thuộc", 1) - 0.6);
          rise("#sum-k", W(sid, "không", 1));
        }

        finish();
      })();
    </script>
  </body>
</html>
