<!DOCTYPE html>
<!--
  Lesson video "<title>" (lesson <lessonId>): <what it shows>.
  Built by `pnpm video:build <lessonId> <name>`, which injects
  window.TIMING (scene windows and spoken word times from script.json).
-->
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <title>Tên video</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="base.css" />
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="60" data-width="1280" data-height="720">
      <div id="stage" class="layer">
        <section id="s1" class="scene layer">
          <div id="beads-1" class="row" style="top: 190px"></div>
          <div id="power-1" class="row math" style="top: 320px"></div>
        </section>
      </div>
      <div id="owl-layer" class="layer"></div>
      <div id="fade" class="layer" style="background: var(--color-background)"></div>
    </div>

    <script src="gsap.min.js"></script>
    <script src="owl.js"></script>
    <script>/*TIMING:BEGIN*/window.TIMING=null;/*TIMING:END*/</script>
    <script src="runtime.js"></script>
    <script>
      (() => {
        const { $, $$, W, pow, beads, owl, pop, hide, pose, scenes, finish } = window.LV;

        // ---------- DOM: build everything before the first tween ----------
        beads($("#beads-1"), 5, "2");
        $("#power-1").innerHTML = pow("2", "5");
        const bird = owl($("#owl-layer"), ["idle", "happy"], { left: "34px", top: "390px" });

        // ---------- scene windows: [selector, scene id from script.json] ----------
        scenes([["#s1", "s01-nam-hat"]]);
        pop(bird.wrap, 0.3, { from: 0.3 });

        // ---------- choreography: every reveal on a spoken word ----------
        {
          const sid = "s01-nam-hat";
          hide([...$$("#beads-1 .bead"), "#power-1"]);
          pop($$("#beads-1 .bead"), W(sid, "hạt"), { stagger: 0.12 });
          pop("#power-1", W(sid, "là"));
          pose(bird, "happy", W(sid, "là"));
        }

        finish();
      })();
    </script>
  </body>
</html>
